<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4C9EEB" />
<meta name="description" content="InkLit — read a little every day and learn new words with Inky the squid." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="InkLit" />
<title>InkLit — Reading & Vocab</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --blue:#4C9EEB;--blue-d:#2F7FD0;--blue-dd:#1E5FA8;--blue-l:#A9D3F7;--blue-xl:#EAF3FE;
  --bg:#F0F7FF;--ink:#1B2B4B;--muted:#6B7A99;--line:#DCEAF9;
  --green:#3CCB7F;--green-d:#24A35F;--pink:#FF6B8A;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--ink);font-family:Nunito,ui-rounded,system-ui,sans-serif;
  background:radial-gradient(circle at 15% -10%,#D7EBFF 0,transparent 45%),var(--bg);
  padding-bottom:calc(112px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px;margin:6px 0 8px;line-height:1.4} .center{text-align:center}
.row{display:flex;align-items:center} .between{justify-content:space-between} .gap{gap:10px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(240,247,255,.78);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:22px;color:var(--blue-d);letter-spacing:-.3px}
.brand-inky{width:36px;display:block} .brand-inky svg{width:100%;height:auto;display:block}
.pills{display:flex;align-items:center;gap:8px}
.pill{padding:6px 11px;border-radius:999px;background:#fff;font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(27,43,75,.08);white-space:nowrap}
.pill.flame:not(.lit){filter:grayscale(.85);opacity:.8}
.pill.flame.lit{background:linear-gradient(135deg,#FFB547,#FF7A3D);color:#fff;box-shadow:0 3px 0 #D9612A}
.bump{animation:bump .55s var(--spring)}
.avatar{width:36px;height:36px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;
  overflow:hidden;padding:0;box-shadow:0 3px 0 var(--blue-dd);transition:transform .2s var(--spring)}
.avatar:active{transform:scale(.92)} .avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* Layout */
main{max-width:520px;margin:0 auto;padding:6px 18px}
.screen{animation:screenIn .5s var(--spring) both}
.hello{font-size:26px;font-weight:900;margin:6px 0 2px;letter-spacing:-.3px}
h2{font-size:20px;font-weight:900;line-height:1.2}
h3{font-size:18px;font-weight:900;margin-bottom:4px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)}
.card{background:#fff;border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 6px 0 rgba(76,158,235,.14),0 12px 30px rgba(27,43,75,.06)}

/* Buttons */
.btn{border:none;border-radius:16px;padding:14px 18px;font-weight:900;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s var(--spring),box-shadow .15s,filter .2s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dd)}
.btn-primary:active{box-shadow:0 1px 0 var(--blue-dd)}
.btn-white{background:#fff;color:var(--blue-d);border:2px solid #E2EEFB;box-shadow:0 4px 0 #CFE3F8}
.btn-ghost{background:var(--blue-xl);color:var(--blue-d)}
.btn:disabled{filter:grayscale(.6);opacity:.55;cursor:not-allowed;transform:none}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%;margin-top:12px}
.link{background:none;border:none;color:var(--blue-d);font-weight:800;text-decoration:underline;cursor:pointer;padding:8px}

/* Inky */
.inky-wrap{display:flex;align-items:flex-end;gap:12px;margin:8px 0 16px}
.inky{width:90px;flex:none;animation:bob 3s ease-in-out infinite;transform-origin:50% 90%}
.inky svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{background:#fff;border-radius:20px 20px 20px 6px;padding:12px 14px;font-weight:800;line-height:1.35;
  box-shadow:0 4px 0 rgba(76,158,235,.18);animation:pop .5s var(--spring) both}
.mood-celebrate .inky{animation:jump .8s var(--spring) 2,bob 3s ease-in-out 1.6s infinite}
.mood-think .inky{animation:think 1.4s ease-in-out infinite}
.mood-comfort .inky{animation:sway 3.5s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.tent{transform-box:fill-box;transform-origin:50% 0;animation:wiggle 2.4s ease-in-out infinite}
.mini-inky{width:54px;flex:none} .mini-inky svg{width:100%;height:auto;display:block}

/* Home */
.book{display:flex;gap:16px}
.cover{width:96px;flex:none;aspect-ratio:2/3;border-radius:14px;background:linear-gradient(160deg,var(--blue-l),var(--blue));display:grid;place-items:center;
  color:#fff;font-weight:900;text-align:center;font-size:13px;cursor:pointer;overflow:hidden;box-shadow:0 4px 0 rgba(30,95,168,.25);transition:transform .2s var(--spring)}
.cover:active{transform:scale(.96)} .cover img{width:100%;height:100%;object-fit:cover}
.book-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.book-info .btn{align-self:flex-start;margin-top:8px}
.progress{height:14px;background:#E3EFFC;border-radius:999px;overflow:hidden;margin:10px 0 6px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),#7CC0FF);border-radius:999px;animation:grow 1.1s var(--spring) both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 0 rgba(76,158,235,.14)}
.stat b{display:block;font-size:20px} .stat small{color:var(--muted);font-weight:800}
.quest-step{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-top:10px;border:none;border-radius:16px;background:#F5FAFF;text-align:left;cursor:pointer;transition:transform .2s var(--spring)}
.quest-step:active{transform:scale(.97)}
.quest-step small{display:block;color:var(--muted);font-weight:700}
.quest-step .ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#fff;box-shadow:0 3px 0 #D6E7FA}
.quest-step.done .ico{background:var(--green);color:#fff;font-weight:900;box-shadow:0 3px 0 var(--green-d)}
.quest-step.locked{opacity:.55}
.notif{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#fff,var(--blue-xl))}

/* Flashcards */
.deck-top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.dots{display:flex;gap:6px}
.dot{width:24px;height:8px;border-radius:999px;background:#D6E7FA;transition:all .4s var(--spring)}
.dot.now{background:var(--blue);width:38px} .dot.done{background:var(--green)}
.flip{perspective:1200px;height:310px;margin-bottom:18px;cursor:pointer;animation:cardIn .55s var(--spring) both}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s var(--spring)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:linear-gradient(160deg,#62B1F3,#3D8EE0);color:#fff;box-shadow:0 8px 0 var(--blue-dd)}
.back{background:#fff;transform:rotateY(180deg);box-shadow:0 8px 0 #CFE3F8}
.flip:not(.flipped) .back,.flip.flipped .front{pointer-events:none}
.pos{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.pos.dark{background:var(--blue-xl);color:var(--blue-d)}
.word{font-size:clamp(34px,10vw,46px);font-weight:900;margin:14px 0 4px;word-break:break-word;letter-spacing:-.5px}
.pron{font-size:18px;font-weight:800;opacity:.92}
.hint{position:absolute;bottom:16px;opacity:.85;font-weight:800}
.def{font-size:21px;font-weight:900;margin:14px 0 8px;line-height:1.3}
.ex{font-style:italic;color:var(--muted);margin:0 0 14px;line-height:1.45;font-weight:700}
.flip.success{animation:celebrate .6s var(--spring)}
.flip.success .front{background:linear-gradient(160deg,#5BE09A,#2DB86E);box-shadow:0 8px 0 var(--green-d)}
.flip.success .back{background:#EFFFF6;box-shadow:0 8px 0 var(--green-d)}
.card-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.card-actions .btn{padding:16px}
.mic.listening{background:var(--pink);box-shadow:0 4px 0 #D9476A;animation:pulse 1.2s infinite}
.heard{text-align:center;font-weight:800;color:var(--muted);min-height:24px;margin:16px 0 2px}
.alt{text-align:center}
.src,.note{text-align:center;font-size:13px;color:var(--muted);font-weight:700;margin-top:10px}
.skeleton{height:310px;border-radius:28px;background:linear-gradient(90deg,#E3EFFC,#F6FAFF,#E3EFFC);background-size:200% 100%;animation:shimmer 1.4s infinite}
.wl{padding:10px 0;border-bottom:2px dashed var(--line)} .wl:last-child{border:none} .wl p{margin-top:4px;color:var(--muted);font-weight:700}

/* Write */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:7px 12px;border-radius:999px;background:var(--blue-xl);color:var(--blue-d);font-weight:900;font-size:14px;transition:all .35s var(--spring)}
.chip.on{background:var(--green);color:#fff;transform:scale(1.07);box-shadow:0 3px 0 var(--green-d)}
textarea,.field{width:100%;border:2px solid var(--line);border-radius:16px;padding:13px;font:inherit;font-size:16px;font-weight:700;background:#FAFCFF;color:var(--ink);outline:none;transition:border-color .2s}
textarea{resize:vertical;min-height:110px;font-size:17px;margin-bottom:6px}
textarea:focus,.field:focus{border-color:var(--blue)}
.quote{font-size:19px;font-weight:900;line-height:1.4;margin:8px 0 14px}
.badge{padding:6px 12px;border-radius:999px;background:var(--blue-xl);color:var(--blue-d);font-weight:900;font-size:14px}
.result{animation:shake .5s}

/* Leaderboard */
.add-friend{display:flex;gap:10px;align-items:center}
.lb-row{display:grid;grid-template-columns:30px 38px 1fr auto auto;gap:10px;align-items:center;padding:10px 6px;border-radius:14px;animation:pop .5s var(--spring) both}
.lb-row.me{background:var(--blue-xl)}
.rank{font-weight:900;text-align:center}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue-l);color:var(--blue-dd);font-weight:900}
.nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-weight:800;font-size:14px;color:#E0612A} .xp{font-weight:900;color:var(--blue-d)}

/* Floating pill dock */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:7px;
  border-radius:999px;background:rgba(255,255,255,.68);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(27,43,75,.16)}
.navbtn{width:68px;height:54px;border:none;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;
  transition:transform .25s var(--spring),background .25s,color .25s}
.navbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.navbtn span{font-size:11px;font-weight:900;line-height:1}
.navbtn.active{background:var(--blue);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 var(--blue-dd)}
.navbtn:active{transform:scale(.95)}

/* Sheet, toast, install card, confetti */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(27,43,75,.35);opacity:0;transition:opacity .3s}
#sheet-root.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92dvh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .5s var(--spring)}
#sheet-root.open .sheet{transform:none}
.sheet h2{text-align:center;margin:4px 0} .sheet>p{text-align:center;font-weight:700}
.sheet label{display:block;font-weight:900;font-size:14px;color:var(--muted);margin-top:12px}
.sheet label .field{margin-top:6px}
.sheet .row.gap label{flex:1}
.sheet a{color:var(--blue-d);font-weight:900}
.sheet-inky{width:96px;margin:0 auto;animation:bob 3s ease-in-out infinite} .sheet-inky svg{width:100%;height:auto;display:block}
#toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));z-index:60;max-width:90vw;transform:translate(-50%,-16px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:12px 16px;border-radius:16px;font-weight:800;text-align:center;transition:all .35s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#install{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;max-width:496px;margin:0 auto;
  opacity:0;transform:translateY(30px);pointer-events:none;transition:all .5s var(--spring)}
#install.show{opacity:1;transform:none;pointer-events:auto}
.install-card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:22px;padding:14px;box-shadow:0 12px 30px rgba(27,43,75,.2)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70;display:none}

/* Keyframes */
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) rotate(4deg)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jump{0%{transform:none}30%{transform:translateY(-22px) scale(1.05,.95) rotate(-6deg)}60%{transform:scale(1.08,.92)}100%{transform:none}}
@keyframes think{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes grow{from{width:0}}
@keyframes celebrate{50%{transform:scale(1.05) rotate(-2deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{0%{box-shadow:0 4px 0 #D9476A,0 0 0 0 rgba(255,107,138,.5)}100%{box-shadow:0 4px 0 #D9476A,0 0 0 18px rgba(255,107,138,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-inky" id="brandInky"></span>InkLit</div>
  <div class="pills">
    <span class="pill flame" id="streakPill"></span>
    <span class="pill" id="xpPill"></span>
    <button class="avatar" id="avatarBtn" data-action="profile" aria-label="Profile and settings"></button>
  </div>
</header>

<main id="view"></main>

<nav class="dock" aria-label="Main navigation">
  <button class="navbtn" data-action="go" data-to="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button class="navbtn" data-action="go" data-to="words" aria-label="Words"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="14" rx="2.5"/><path d="M8 3h10.5A2.5 2.5 0 0 1 21 5.5V17"/></svg><span>Words</span></button>
  <button class="navbtn" data-action="go" data-to="write" aria-label="Write"><svg viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 7.5l2 2"/></svg><span>Write</span></button>
  <button class="navbtn" data-action="go" data-to="friends" aria-label="Leaderboard"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 16v5M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v1.5A3.5 3.5 0 0 1 16.6 10M7 5H4v1.5A3.5 3.5 0 0 0 7.4 10"/></svg><span>Ranks</span></button>
</nav>

<div id="install"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>
<canvas id="confetti"></canvas>

const Sound = {
  ctx: null,
  play(kind) {
    if (!state.sound) return;
    try {
      this.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx; if (c.state === 'suspended') c.resume();
      const seq = { tap:[[620,.035]], flip:[[880,.03],[1175,.03]], success:[[523,.08],[659,.08],[784,.14]], soft:[[392,.08],[349,.12]] }[kind] || [];
      let t = c.currentTime;
      for (const [f, d] of seq) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03); t += d * .85;
      }
    } catch {}
  }
};
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000); }
function confetti() {
  if (reduceMotion) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr); cv.style.display = 'block';
  const colors = ['#4C9EEB','#FFC83D','#FF9EB5','#3CCB7F','#A9D3F7','#FF8A3D'];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    s: Math.random() * 6 + 5, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, c: colors[Math.random() * colors.length | 0] }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (++f < 170) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })();
}

/* ============ GEMINI (each user's own key, called directly from their browser) ============ */
let warnedKey = false;
function keyProblem(e) { if (e?.badKey && !warnedKey) { warnedKey = true; toast("Your Gemini key didn't work — check it by tapping your profile picture 🔑"); } }

async function askGemini(prompt, schema) {
  const key = getApiKey();
  if (!key) throw new Error('no-key');
  let err;
  for (const model of [MODELS.primary, MODELS.fallback]) {
    try {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 20000);
      const res = await fetch(`${GEMINI_API}${model}:generateContent`, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: 'application/json', responseSchema: schema } })
      });
      clearTimeout(timer);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const e = new Error(data.error?.message || `HTTP ${res.status}`);
        if (res.status === 401 || res.status === 403 || (res.status === 400 && /api key/i.test(e.message))) e.badKey = true;
        throw e;
      }
      const text = (data.candidates?.[0]?.content?.parts || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
      if (!text) throw new Error('empty response');
      return JSON.parse(text);
    } catch (e) {
      if (e.badKey) throw e;
      err = e; console.info(`[InkLit] ${model} failed`, e);
    }
  }
  throw err;
}
async function testKey(key) {
  try {
    const res = await fetch(GEMINI_API + MODELS.primary, { headers: { 'x-goog-api-key': key } });
    if (res.ok) return 'ok';
    if (res.status === 404) return 'no-model';
    if (res.status === 429) return 'busy';
    return 'bad';
  } catch { return 'offline'; }
}

let fbPromise = null;
function loadFirebase() {

    try {
      const [appMod, authMod, fsMod] = await Promise.all(['app','auth','firestore'].map(n => import(`${FB}firebase-${n}.js`)));
      const app = appMod.initializeApp(firebaseConfig);
      const out = { app, authMod, fsMod, auth: authMod.getAuth(app), db: fsMod.getFirestore(app), provider: new authMod.GoogleAuthProvider() };

}

/* ============ WORD LOGIC ============ */
const isCleanWord = w => w && typeof w.word === 'string' && /^[a-z][a-z'-]{2,24}$/i.test(w.word.trim()) &&
  ['partOfSpeech','pronunciation','definition','example'].every(k => typeof w[k] === 'string' && w[k].trim());

async function generateWords(n) {
  const avoid = state.learned.slice(-200);
  if (getApiKey()) {
    try {
      const data = await askGemini(wordsPrompt(n, avoid), WORDS_SCHEMA);
      const list = (data.words || []).filter(isCleanWord)
        .map(w => ({ word: w.word.trim().toLowerCase(), partOfSpeech: w.partOfSpeech.trim().slice(0, 20), pronunciation: w.pronunciation.trim().slice(0, 40),
          definition: w.definition.trim().slice(0, 140), example: w.example.trim().slice(0, 220) }))
        .filter((w, i, a) => !avoid.includes(w.word) && a.findIndex(x => x.word === w.word) === i).slice(0, n);
      if (list.length >= 3) return { words: list, source: 'gemini' };
    } catch (e) { keyProblem(e); console.info('[InkLit] using offline word bank', e); }
  }
  const pool = WORD_BANK.filter(w => !state.learned.includes(w.word));
  return { words: shuffle(pool.length >= n ? pool : WORD_BANK).slice(0, n), source: 'offline' };
}

let dayLoading = false;
async function ensureDay() {
  if (todayDay() || dayLoading) return;
  dayLoading = true;
  const date = today();
  const { words, source } = await generateWords(WORDS_PER_DAY);
  state.day = { date, source, completed: false, words: words.map(w => ({ ...w, done: false, tries: 0 })) };
  dayLoading = false; save();
  if (tab === 'home' || tab === 'words') render();
}

function wordMatches(t, w) {
  if (t === w) return true;
  const L = w.length;
  const stem = L >= 8 ? w.slice(0, L - 2) : L === 7 ? w.slice(0, L - 1) : (w.endsWith('e') ? w.slice(0, -1) : w);
  return t.startsWith(stem) && t.length - L <= 5;
}
const tokens = text => text.toLowerCase().match(/[a-z]+(?:['-][a-z]+)*/g) || [];
const usesWord = (text, w) => tokens(text).some(t => wordMatches(t, w));
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function saidMatches(transcript, word) {
  const tk = tokens(transcript); if (!tk.length) return false;
  const cands = new Set([...tk, tk.join(''), ...tk.slice(1).map((x, i) => tk[i] + x)]);
  for (const c of cands) if (wordMatches(c, word) || 1 - lev(c, word) / Math.max(c.length, word.length) >= 0.75) return true;
  return false;
}
function localValidate(text, targets) {
  const words = text.split(/\s+/).filter(Boolean), found = targets.filter(w => usesWord(text, w));
  const uniqueRatio = new Set(words.map(w => w.toLowerCase())).size / words.length;
  if (words.length < 8) return { passed: false, feedback: 'Love the start! Add a little more about what happened in your reading — aim for at least 8 words 📖', detectedWords: found };
  if (uniqueRatio < .6) return { passed: false, feedback: 'Tell me one real thing that happened or stood out in your reading today! 💙', detectedWords: found };
  if (found.length < 2) { const miss = targets.find(w => !found.includes(w)); return { passed: false, feedback: `Almost there! Try using "${miss}" in your sentence to lock in today's streak!`, detectedWords: found }; }
  return { passed: true, feedback: `Wonderful! You used "${found[0]}" and "${found[1]}" beautifully. Streak locked! 🎉`, detectedWords: found };
}

/* ============ SPEECH ============ */
function speak(text, rate = .85) {
  if (!('speechSynthesis' in window)) { toast("This browser can't read words aloud yet."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /en[-_]US/i.test(v.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const currentWord = () => todayDay()?.words.find(w => !w.done);
const setHeard = html => { const h = $('#heard'); if (h) h.innerHTML = html; };
const showAlt = () => { const a = $('#altWrap'); if (a && !a.innerHTML.trim()) a.innerHTML = '<button class="link" data-action="mark">I said it — mark as practiced</button>'; };

let rec = null;
function stopListening() { if (rec) { rec._aborted = true; try { rec.abort(); } catch {} rec = null; } $('#micBtn')?.classList.remove('listening'); }
function toggleListening() {
  const w = currentWord(); if (!w) return;
  if (!SR) { setHeard("Voice check isn't available in this browser — tap below to mark it practiced."); showAlt(); return; }
  if (rec) { stopListening(); setHeard('Stopped listening.'); return; }
  if ('speechSynthesis' in window) speechSynthesis.cancel(); // so Inky doesn't hear its own voice
  const r = new SR(); rec = r;
  r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let matched = false, heard = '', fatal = false;
  r.onresult = e => {
    const alts = [];
    for (let i = e.resultIndex; i < e.results.length; i++) for (let j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript);
    if (alts[0]) heard = alts[0].trim();
    setHeard(`I heard: “${esc(heard)}”`);
    if (!matched && alts.some(t => saidMatches(t, w.word))) { matched = true; try { r.stop(); } catch {} completeCard(true); }
  };
  r.onerror = e => {
    if (['not-allowed','service-not-allowed','audio-capture'].includes(e.error)) { fatal = true; setHeard('Inky needs microphone access to hear you. You can also mark this card as practiced.'); showAlt(); }
    else if (e.error === 'network') { fatal = true; setHeard('Voice check needs an internet connection right now.'); showAlt(); }
    else if (e.error === 'no-speech') setHeard("I didn't catch that — try again a little closer to the mic! 🎤");
  };
  r.onend = () => {
    if (rec === r) rec = null;
    $('#micBtn')?.classList.remove('listening');
    if (matched || r._aborted || fatal || !heard) return;
    w.tries = (w.tries || 0) + 1; persist(); Sound.play('soft');
    setHeard(`So close! I heard “${esc(heard)}”. Tap Listen, then try once more 💙`);
    if (w.tries >= 2) showAlt();
  };
  try { r.start(); $('#micBtn')?.classList.add('listening'); setHeard('Listening… 👂'); } catch { rec = null; }
}

let completing = false;
function completeCard(viaVoice) {
  const d = todayDay(), w = d?.words.find(x => !x.done);
  if (!w || completing) return;
  completing = true; stopListening();
  w.done = true; state.xp += 10;
  if (!state.learned.includes(w.word)) state.learned.push(w.word);
  if (d.words.every(x => x.done)) d.completed = true;
  save(); renderTopbar(); Sound.play('success'); buzz([20, 40, 20]);
  $('#flip')?.classList.add('success');
  document.querySelectorAll('.card-actions button').forEach(b => b.disabled = true);
  setHeard(viaVoice ? `Yes! “${esc(w.word)}” sounds perfect 🎉 +10 XP` : 'Practiced! +10 XP 🎉');
  setTimeout(() => {
    completing = false;
    if (tab === 'words') render();

/* ============ SENTENCE SUBMISSION ============ */
function updateDetection(quiet) {
  const ta = $('#sentence'); if (!ta) return;
  const chips = [...document.querySelectorAll('#chips .chip')];
  const found = chips.map(c => c.dataset.word).filter(w => usesWord(ta.value, w));
  chips.forEach(c => {
    const on = found.includes(c.dataset.word);
    if (on && !c.classList.contains('on') && !quiet) { Sound.play('tap'); buzz(10); }
    c.classList.toggle('on', on);
  });
  const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
  $('#usedCount').textContent = found.length >= 2 ? `✓ ${found.length} words used — nice!` : `${found.length} of 2 words used`;
  $('#submitBtn').disabled = found.length < 2 || n < 6;
}

let submitting = false;
async function submitSentence() {
  const ta = $('#sentence'), d = todayDay();
  if (submitting || !ta || !d) return;
  const text = ta.value.trim().slice(0, 400);
  const targets = d.words.filter(w => w.done).map(w => w.word);
  if (targets.filter(w => usesWord(text, w)).length < 2) return;
  submitting = true;
  const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = 'Inky is reading… 🦑'; ta.disabled = true;
  $('#result').innerHTML = `<div class="card">${inky('think', 'Hmm, let me read that carefully…')}</div>`;
  let v, source = 'gemini';
  try {
    const raw = await askGemini(validationPrompt(text, targets), VERDICT_SCHEMA);
    const det = (Array.isArray(raw.detectedWords) ? raw.detectedWords : []).map(x => String(x).toLowerCase().trim()).filter(x => targets.includes(x));
    const ok = raw.passed === true && det.length >= 2;
    const msg = String(raw.feedback || '').slice(0, 300);
    v = { passed: ok, detectedWords: det,
      feedback: ok ? (msg || 'Wonderful sentence! 🎉') : raw.passed ? "Almost there! Make sure two of today's words fit naturally in your sentence 💙" : (msg || 'Almost there! Give it one more try 💙') };
  } catch (e) { keyProblem(e); v = localValidate(text, targets); source = 'offline'; }
  submitting = false;
  const log = { date: today(), writtenSentence: text, status: v.passed ? 'approved' : 'rejected' };
  state.logs = [log, ...state.logs].slice(0, 60);
  if (v.passed) { lockStreak(); state.xp += 50; state.draft = ''; state.comfort = false; state.lastFeedback = v.feedback; }
  save(); remoteLog(log);
  if (v.passed) {
    render(); confetti(); Sound.play('success'); buzz([30, 50, 30]);
    toast(`+50 XP · ${state.streakCount}-day streak! 🔥`);
  } else {
    Sound.play('soft');
    if (ta.isConnected) { ta.disabled = false; btn.textContent = 'Try again 🔒'; updateDetection(true); }
    const r = $('#result');
    const note = source === 'offline' ? `<p class="src">Checked by Inky’s offline helper${getApiKey() ? '' : ' · add a Gemini key for AI checking'}</p>` : '';
    if (r) r.innerHTML = `<div class="card result">${inky('comfort', v.feedback)}${note}</div>`;
  }
}

async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function enableNotifs() {

  state.notifDismissed = true; persist(); render();
  if (perm !== 'granted') { toast('No worries! You can turn reminders on anytime in your browser settings.'); return; }

  try {
    const fb = await loadFirebase();
    const reg = await navigator.serviceWorker?.getRegistration();
    if (!fb?.messaging || !reg) return;
    const token = await fb.msgMod.getToken(fb.messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token && user) {
      const { doc, setDoc, serverTimestamp } = fb.fsMod;
      await setDoc(doc(fb.db, 'users', user.uid, 'fcmTokens', await sha256(token)), { token, createdAt: serverTimestamp() });
    }
  } catch (e) { console.info('[InkLit] FCM token not registered', e); }
}

function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

  'save-key': () => saveKey(),
  'toggle-key': el => { const i = $('#apiKey'); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? '👁 Show' : '🙈 Hide'; },
  'remove-key': () => { localStorage.removeItem(API_KEY_STORE); closeSheet(); render(); toast("Key removed. Inky will use the built-in word list."); },
  'dismiss-key-banner': () => { state.keyBannerDismissed = true; persist(); render(); },
  flip: el => { el.classList.toggle('flipped'); Sound.play('flip'); buzz(10); },
  listen: () => { const w = currentWord(); if (w) speak(w.word); },
  'listen-example': () => { const w = currentWord(); if (w) speak(w.example, .95); },
  say: () => toggleListening(),
  mark: () => completeCard(false),
  submit: () => submitSentence(),
  'enable-notifs': () => enableNotifs(),
  'dismiss-notifs': () => { state.notifDismissed = true; persist(); render(); },
  install: () => doInstall(),
  'dismiss-install': () => { state.installDismissed = true; persist(); $('#install').classList.remove('show'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  if (el.tagName === 'BUTTON') { buzz(15); Sound.play('tap'); }
  actions[el.dataset.action]?.(el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'sentence') { state.draft = e.target.value; persist(); updateDetection(false); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.change !== 'cover' || !e.target.files?.[0]) return;
  if (!state.book) { toast('Add your book first 📖'); openBookSheet(false); return; }
  try {
    state.book.cover = await resizeImage(e.target.files[0], 400);
    save(); render(); Sound.play('success');
  } catch { toast("Couldn't read that image — try another one."); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'friendForm') return;
  e.preventDefault();
  const h = $('#friendHandle').value.trim(); if (!h) return;
  toast(`Friend lookup is coming next — Inky will find ${h} soon! 🦑`); e.target.reset();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checkStreak(); ensureDay(); renderTopbar();
});

/* ============ BOOT ============ */
$('#brandInky').innerHTML = INKY;
document.querySelector('link[rel="icon"]').href = 'data:image/svg+xml,' + encodeURIComponent(INKY);
checkStreak();
render();
if (!state.onboarded) openBookSheet(true);
ensureDay();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => console.info('[InkLit] sw.js not found yet'));
}
setTimeout(maybeShowInstall, 4000);
loadFirebase().then(fb => {
  if (!fb) return;
  fb.authMod.onAuthStateChanged(fb.auth, u => { user = u; renderTopbar(); if (u) pullRemote(); });
  if (fb.messaging) fb.msgMod.onMessage(fb.messaging, p => toast(p.notification?.body || 'Inky says hi! 🦑'));
});
</script>
</body>
</html>
