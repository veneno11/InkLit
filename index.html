const bankWord = (entry, srs = {}) => normalizeWord({ ...entry, wordId: wordIdOf(entry.word), addedAt: Date.now(), ...srs });

function normalizeMeta(m = {}) {
  m = m && typeof m === 'object' ? m : {};
  const readDays = {};
  if (m.readDays && typeof m.readDays === 'object') {
    Object.entries(m.readDays).forEach(([k, v]) => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Number(v) > 0) readDays[k] = Number(v); });

function booksFrom(obj) {

// --- Book + streak helpers ---
const readingBooks = () => Object.values(S.books).filter(b => b.status === 'reading')
  .sort((a, b) => (b.lastReadAt || b.createdAt) - (a.lastReadAt || a.createdAt));
const finishedBooks = () => Object.values(S.books).filter(b => b.status === 'finished')
  .sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
const bookPct = b => b.status === 'finished' ? 100 : b.totalPages ? clamp(Math.round(b.currentPage / b.totalPages * 100), 0, 100) : 0;

const didRead = key => (Number(S.meta?.readDays?.[key]) || 0) > 0;
function streakInfo() {
  if (!S.meta) return { streak: 0, today: false, atRisk: false };
  const today = dayKey();
  const readToday = didRead(today);
  let day = readToday ? today : shiftDay(today, -1);
  let n = 0;
  while (didRead(day) && n < 4000) { n++; day = shiftDay(day, -1); }
  return { streak: n, today: readToday, atRisk: !readToday && n > 0 };
}
function bestStreak() {
  let best = 0, run = 0, prev = null;
  Object.keys(S.meta?.readDays || {}).filter(didRead).sort().forEach(k => {
    run = prev && shiftDay(prev, 1) === k ? run + 1 : 1;
    best = Math.max(best, run);
    prev = k;
  });
  return best;
}
const lastReadDay = () => Object.keys(S.meta?.readDays || {}).filter(didRead).sort().pop() || '';

function backfillStreak(readDays, lastLogDate, streakCount) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(lastLogDate || '') || !(streakCount > 0)) return;
  for (let i = 0; i < Math.min(streakCount, 400); i++) {
    const k = shiftDay(lastLogDate, -i);
    readDays[k] = Math.max(Number(readDays[k]) || 0, 1);
  }
}

function migrateV1Local() {

  });

    books[b.id] = b;

  const vocab = {};
  const nowIso = new Date().toISOString(), dueIso = new Date(dayStart()).toISOString();
  (Array.isArray(v1.learned) ? v1.learned : []).forEach(word => {
    const entry = WORD_BANK.find(e => e.word === String(word).toLowerCase());
    if (!entry) return;
    const w = bankWord(entry, { state: 'review', repetitionCount: 1, interval: 1, easeFactor: 2.5, lastReviewed: nowIso, nextDueDate: dueIso });
    vocab[w.wordId] = w;
  });

  writeJSON(STORE.guest, {
    profile: { name: String(v1.name || '').slice(0, 40), xp: Math.max(0, Number(v1.xp) || 0) },
    books, vocab, meta
  });
}

/* =====================================================================
   17. CLOUD SYNC — Google sign-in + Firestore with a persistent offline cache.
   Writes queue while offline and flush automatically on reconnect.
   ===================================================================== */
const FB = { ready: null, A: null, F: null, auth: null, db: null, user: null, unsubs: [], listening: false };
const sync = { pending: 0, error: false };
let cloudFirst = { profile: false, books: false, vocab: false, meta: false };
let cloudReadyResolve = () => {};
let cloudReady = Promise.resolve();

function loadFirebase() {
  if (FB.ready) return FB.ready;
  FB.ready = (async () => {
    try {
      const [appMod, A, F] = await Promise.all(['app', 'auth', 'firestore'].map(n => import(`${FB_SDK}firebase-${n}.js`)));
      const app = appMod.initializeApp(firebaseConfig);
      FB.A = A;
      FB.F = F;
      FB.auth = A.getAuth(app);
      try {
        FB.db = F.initializeFirestore(app, {
          localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }),
          ignoreUndefinedProperties: true
        });
      } catch (e) {
        console.info('[InkLit] Offline cache unavailable, using memory cache', e);
        try { FB.db = F.initializeFirestore(app, { ignoreUndefinedProperties: true }); }
        catch { FB.db = F.getFirestore(app); }
      }
      return FB;
    } catch (e) {
      console.info('[InkLit] Firebase unavailable, staying on this device', e);
      FB.ready = null;
      return null;
    }
  })();
  return FB.ready;
}

const cloudOn = () => !!(S.uid && FB.db && FB.user && FB.user.uid === S.uid);
const inc = n => FB.F ? FB.F.increment(n) : n;
const delField = () => FB.F ? FB.F.deleteField() : null;
const cloudRef = path => path.length ? FB.F.doc(FB.db, 'users', S.uid, ...path) : FB.F.doc(FB.db, 'users', S.uid);

function cloudWrite(path, data, { merge = true } = {}) {
  if (!cloudOn()) return;
  try { trackWrite(merge ? FB.F.setDoc(cloudRef(path), data, { merge: true }) : FB.F.setDoc(cloudRef(path), data)); }
  catch (e) { onSyncError(e); }
}
function cloudDelete(path) {
  if (!cloudOn()) return;
  try { trackWrite(FB.F.deleteDoc(cloudRef(path))); } catch (e) { onSyncError(e); }
}
function cloudBatch(ops) {
  if (!cloudOn() || !ops.length) return;
  try {
    const batch = FB.F.writeBatch(FB.db);
    ops.forEach(o => {
      if (o.del) batch.delete(cloudRef(o.path));
      else if (o.merge === false) batch.set(cloudRef(o.path), o.data);
      else batch.set(cloudRef(o.path), o.data, { merge: true });
    });
    trackWrite(batch.commit());
  } catch (e) { onSyncError(e); }
}

function trackWrite(promise) {
  sync.pending++;
  updateSyncDot();
  if (navigator.onLine === false) requestBgSync();
  Promise.resolve(promise)
    .then(() => { sync.error = false; })
    .catch(onSyncError)
    .finally(() => { sync.pending = Math.max(0, sync.pending - 1); updateSyncDot(); });
}

let syncWarned = false;
function onSyncError(err) {
  console.warn('[InkLit] sync error', err);
  sync.error = true;
  updateSyncDot();
  if (!syncWarned && err?.code === 'permission-denied') {
    syncWarned = true;
    toast('The cloud database blocked a change. Make sure the V2 Firestore rules are published.', { type: 'error', ic: 'cloudOff', ms: 7000 });
  }
}

function requestBgSync() {
  navigator.serviceWorker?.ready?.then(reg => reg.sync?.register('inklit-resync')).catch(() => {});
}
function resyncNow() {
  if (!FB.db || !FB.F) return;
  FB.F.enableNetwork(FB.db).catch(() => {});
  updateSyncDot();
}

function syncState() {
  if (!S.uid) return 'local';
  if (sync.error) return 'error';
  if (navigator.onLine === false) return 'offline';
  if (sync.pending) return 'syncing';
  return 'synced';
}
const SYNC_TEXT = {
  local: 'Saved on this device. Sign in to sync.',
  synced: 'Synced across your devices',
  syncing: 'Syncing your changes…',
  offline: "Offline. Changes will sync when you're back online.",
  error: "Some changes couldn't sync yet."
};
function updateSyncDot() {
  const dot = $('#syncDot');
  if (!dot) return;
  const st = syncState();
  dot.className = 'sync-dot' + (st === 'local' ? '' : ' ' + st);
  dot.title = SYNC_TEXT[st];
}

// --- Writers used by the rest of the app ---
function createBook(b) {
  S.books[b.id] = b;
  persistLocal();
  cloudWrite(['books', b.id], b, { merge: false });
  scheduleRender();
  putProfile();
}
// Counters (readSec, sessions) are never written here, only incremented, so devices can't clobber each other
function patchBook(id, patch) {
  const b = S.books[id];
  if (!b) return;
  Object.assign(b, patch, { updatedAt: Date.now() });
  persistLocal();
  cloudWrite(['books', id], { ...patch, updatedAt: b.updatedAt });
  scheduleRender();
  putProfile();
}
function removeBook(id) {
  const b = S.books[id];
  if (!b) return;
  delete S.books[id];
  persistLocal();
  cloudDelete(['books', id]);
  scheduleRender();
  putProfile();
  toast(`Removed ${b.title}.`, { ic: 'trash', action: { label: 'Undo', onClick: () => createBook(b) } });
}

function putWord(w) {
  w.updatedAt = Date.now();
  S.vocab[w.wordId] = w;
  persistLocal();
  cloudWrite(['vocab', w.wordId], w, { merge: false });
}
function putWords(list) {
  const now = Date.now();
  list.forEach(w => { w.updatedAt = now; S.vocab[w.wordId] = w; });
  persistLocal();
  for (let i = 0; i < list.length; i += 450) {
    cloudBatch(list.slice(i, i + 450).map(w => ({ path: ['vocab', w.wordId], data: w, merge: false })));
  }
}

// readDays and sessionCount are left out on purpose: they only change through increments
const metaDoc = () => ({
  drillBag: S.meta.drillBag, lastDrill: S.meta.lastDrill,
  lessons: S.meta.lessons.slice(-30), milestones: S.meta.milestones.slice(-40),
  v1Migrated: !!S.meta.v1Migrated, updatedAt: Date.now()
});
const pushMeta = debounce(() => cloudWrite(['meta', 'progress'], metaDoc()), 400);
function putMeta() { persistLocal(); pushMeta(); }

// What friends can see (users/{uid}). XP is only ever incremented, never written here.
function publicProfile() {
  const st = streakInfo(), r = readingBooks()[0];
  const words = Object.values(S.vocab);
  const p = {
    streak: st.streak,
    lastRead: lastReadDay(),
    finished: finishedBooks().length,
    reading: r ? { title: r.title, author: r.author || '', pct: bookPct(r) } : null,
    wordsLearned: words.filter(w => w.state !== 'new').length,
    wordsMastered: words.filter(w => w.state === 'mastered').length,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
    updatedAt: Date.now()
  };
  if (S.profile.name) p.name = S.profile.name;
  if (S.profile.photo) p.photo = S.profile.photo;
  if (S.profile.inviteCode) p.inviteCode = S.profile.inviteCode;
  return p;
}
const pushProfile = debounce(() => cloudWrite([], publicProfile()), 800);
function putProfile() { persistLocal(); pushProfile(); }

function addXP(n) {
  n = Math.round(n || 0);
  if (!n) return;
  S.profile.xp = Math.max(0, (S.profile.xp || 0) + n);
  persistLocal();
  cloudWrite([], { xp: inc(n) });
  renderTopbar();
}

// --- Auth ---
function signIn() {
  if (!FB.auth) {
    toast('Still connecting to the cloud. Try again in a moment.', { ic: 'cloud' });
    initCloud();
    return;
  }
  const provider = new FB.A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  const iosApp = /iphone|ipad|ipod/i.test(navigator.userAgent) && (navigator.standalone || matchMedia('(display-mode: standalone)').matches);
  if (iosApp) return FB.A.signInWithRedirect(FB.auth, provider).catch(authError);
  return FB.A.signInWithPopup(FB.auth, provider)
    .then(() => toast('Signed in. Your reading now syncs across your devices.', { type: 'success', ic: 'cloud' }))
    .catch(e => {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e?.code)) {
        return FB.A.signInWithRedirect(FB.auth, provider).catch(authError);
      }
      authError(e);
    });
}
function authError(e) {
  const code = e?.code || '';
  if (['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/user-cancelled'].includes(code)) return;
  if (code === 'auth/unauthorized-domain') toast('Add this website in Firebase under Authentication, Settings, Authorized domains.', { type: 'error', ms: 7000 });
  else if (code === 'auth/network-request-failed') toast("You're offline. Sign in once you're back online.", { type: 'error' });
  else toast("Sign-in didn't work this time. Please try again.", { type: 'error' });
}
async function signOutUser() {
  if (!FB.auth?.currentUser) return;
  const ok = await confirmSheet({
    title: 'Sign out?', ic: 'logout', confirm: 'Sign out',
    text: 'Your progress stays in your account. This device goes back to its own local data until you sign in again.'
  });
  if (!ok) return;
  try { await FB.A.signOut(FB.auth); toast('Signed out.', { ic: 'logout' }); }
  catch { toast("Couldn't sign out right now.", { type: 'error' }); }
}

async function initCloud() {
  const fb = await loadFirebase();
  if (!fb) {
    UI.authKnown = true;
    UI.cloudFailed = true;
    updateSyncDot();
    scheduleRender();
    afterAuth(null);
    return;
  }
  UI.cloudFailed = false;
  if (FB.listening) return;
  FB.listening = true;
  fb.A.getRedirectResult(fb.auth).catch(authError);
  fb.A.onAuthStateChanged(fb.auth, onAuth);
}

function onAuth(user) {
  FB.user = user || null;
  UI.authKnown = true;
  if (user) {
    if (S.uid !== user.uid) {
      persistLocal.flush();
      stopCloud();
      stopSocial();
      loadScope(user.uid);
      try { localStorage.setItem(STORE.lastUid, user.uid); } catch {}
    }
    if (!S.profile.name && user.displayName) S.profile.name = user.displayName.split(' ')[0].slice(0, 40);
    if (!S.profile.photo && /^https:\/\//.test(user.photoURL || '')) S.profile.photo = user.photoURL;
    startCloud();
    mergeGuestWhenReady();
    startSocial(user);
  } else if (S.uid) {
    persistLocal.flush();
    stopCloud();
    stopSocial();
    loadScope(null);
    try { localStorage.removeItem(STORE.lastUid); } catch {}
  }
  scheduleRender();
  updateSyncDot();
  afterAuth(user);
}

// --- Live listeners ---
function resetCloudReady() {
  cloudFirst = { profile: false, books: false, vocab: false, meta: false };
  cloudReady = new Promise(r => { cloudReadyResolve = r; });
}
function markFirst(key, snap) {
  if (snap.metadata.fromCache || cloudFirst[key]) return false;
  cloudFirst[key] = true;
  if (Object.values(cloudFirst).every(Boolean)) cloudReadyResolve();
  return true;
}

function startCloud() {
  stopCloud();
  resetCloudReady();
  const uid = S.uid, F = FB.F;
  const opts = { includeMetadataChanges: true }; // so we learn when the server has confirmed the cache
  const guard = fn => snap => { if (S.uid === uid) fn(snap); };
  FB.unsubs = [
    F.onSnapshot(cloudRef([]), opts, guard(onProfileSnap), onSyncError),
    F.onSnapshot(F.collection(FB.db, 'users', uid, 'books'), opts, guard(onBooksSnap), onSyncError),
    F.onSnapshot(F.collection(FB.db, 'users', uid, 'vocab'), opts, guard(onVocabSnap), onSyncError),
    F.onSnapshot(cloudRef(['meta', 'progress']), opts, guard(onMetaSnap), onSyncError)
  ];
}
function stopCloud() {
  FB.unsubs.forEach(u => { try { u(); } catch {} });
  FB.unsubs = [];
}

function onProfileSnap(snap) {
  const first = markFirst('profile', snap);
  if (snap.exists()) {
    const d = snap.data();
    const p = normalizeProfile(d);
    S.profile.name = p.name || S.profile.name;
    S.profile.photo = p.photo || S.profile.photo;
    S.profile.xp = p.xp;
    S.profile.inviteCode = p.inviteCode || S.profile.inviteCode;
    S.profile.createdAt = p.createdAt || S.profile.createdAt;
    if (Number(d.streakCount) > 0 && d.lastLogDate) S._v1Cloud = { streakCount: Number(d.streakCount), lastLogDate: d.lastLogDate };
  } else if (!snap.metadata.fromCache) {
    S.profile.createdAt = S.profile.createdAt || Date.now();
    cloudWrite([], { ...publicProfile(), xp: inc(0), createdAt: S.profile.createdAt });
  }
  if (first) {
    maybeBackfillV1();
    ensureInviteCode();
    putProfile();
  }
  persistLocal();
  scheduleRender();
}

function onBooksSnap(snap) {
  const first = markFirst('books', snap);
  if (!first && !snap.docChanges().length) return; // metadata-only update
  if (snap.empty && snap.metadata.fromCache && Object.keys(S.books).length) return;
  const next = {};
  snap.forEach(d => { const b = normalizeBook({ ...d.data(), id: d.id }); next[b.id] = b; });
  S.books = next;
  persistLocal();
  scheduleRender();
}

function onVocabSnap(snap) {
  const first = markFirst('vocab', snap);
  if (!first && !snap.docChanges().length) return;
  if (snap.empty && snap.metadata.fromCache && Object.keys(S.vocab).length) return;
  const next = {};
  snap.forEach(d => {
    const data = d.data();
    if (!data?.word) return;
    const w = normalizeWord({ ...data, wordId: d.id });
    next[w.wordId] = w;
  });
  S.vocab = next;
  persistLocal();
  scheduleRender(); // another device finishing a drill updates due dates and the next lesson here
}

function onMetaSnap(snap) {
  const first = markFirst('meta', snap);
  if (snap.exists()) {
    S.meta = normalizeMeta(snap.data());
  } else if (first) {
    // New account (or a V1 account): upload what this device already has
    cloudWrite(['meta', 'progress'], { ...metaDoc(), readDays: { ...S.meta.readDays }, sessionCount: S.meta.sessionCount || 0 });
  }
  if (first) maybeBackfillV1();
  persistLocal();
  scheduleRender();
}

// V1 stored only "streakCount + lastLogDate" on the user doc; turn that into real reading days once
function maybeBackfillV1() {
  if (!cloudFirst.meta || !cloudFirst.profile || !S._v1Cloud || S.meta.v1Migrated) return;
  const days = {};
  backfillStreak(days, S._v1Cloud.lastLogDate, S._v1Cloud.streakCount);
  const add = {};
  Object.entries(days).forEach(([k, v]) => { if (!didRead(k)) { add[k] = v; S.meta.readDays[k] = v; } });
  S.meta.v1Migrated = true;
  S._v1Cloud = null;
  cloudWrite(['meta', 'progress'], { readDays: add, v1Migrated: true });
}

// First sign-in on a device that was used signed-out: move that progress into the account
async function mergeGuestWhenReady() {
  const uid = S.uid;
  const guest = readJSON(STORE.guest, null);
  if (!guestHasContent(guest)) return;
  await cloudReady;
  if (S.uid !== uid || !cloudOn()) return;

  const gBooks = booksFrom(guest.books), gVocab = vocabFrom(guest.vocab);
  const gMeta = normalizeMeta(guest.meta), gProfile = normalizeProfile(guest.profile);
  const ops = [];

  Object.values(gBooks).forEach(b => {
    if (!S.books[b.id]) { S.books[b.id] = b; ops.push({ path: ['books', b.id], data: b, merge: false }); }
  });
  Object.values(gVocab).forEach(w => {
    const cur = S.vocab[w.wordId];
    if (!cur || toMs(w.lastReviewed) > toMs(cur.lastReviewed)) { S.vocab[w.wordId] = w; ops.push({ path: ['vocab', w.wordId], data: w, merge: false }); }
  });

  const days = {};
  Object.entries(gMeta.readDays).forEach(([k, v]) => {
    if (v > (Number(S.meta.readDays[k]) || 0)) { days[k] = v; S.meta.readDays[k] = v; }
  });
  S.meta.milestones = [...new Set([...S.meta.milestones, ...gMeta.milestones])].slice(-40);
  S.meta.lessons = [...S.meta.lessons, ...gMeta.lessons].sort((a, b) => toMs(a.at) - toMs(b.at)).slice(-30);
  S.meta.sessionCount = (S.meta.sessionCount || 0) + (gMeta.sessionCount || 0);
  ops.push({ path: ['meta', 'progress'], data: { ...metaDoc(), readDays: days, sessionCount: inc(gMeta.sessionCount || 0) } });

  // V1 data may already be counted in the account's XP, so only add the difference there
  const xpDelta = gMeta.fromV1 ? Math.max(0, gProfile.xp - (S.profile.xp || 0)) : gProfile.xp;
  if (xpDelta) { S.profile.xp += xpDelta; ops.push({ path: [], data: { xp: inc(xpDelta) } }); }
  if (!S.profile.name && gProfile.name) S.profile.name = gProfile.name;

  for (let i = 0; i < ops.length; i += 450) cloudBatch(ops.slice(i, i + 450));
  try { localStorage.removeItem(STORE.guest); } catch {}
  persistLocal();
  putProfile();
  scheduleRender();
  toast('Everything you did on this device is now saved to your account.', { type: 'success', ic: 'cloud' });
}

/* =====================================================================
   18. RENDER SCHEDULING + TOP BAR
   ===================================================================== */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;

}

const topPrev = { xp: null, streak: null };

/* =====================================================================
   19. READING STREAK + "YES, I READ TODAY"
   readDays = { 'YYYY-MM-DD': seconds read }. A tap logs 1 second, which counts the day.
   ===================================================================== */
function pruneReadDays() {
  const keys = Object.keys(S.meta.readDays).sort();
  if (keys.length > 420) keys.slice(0, keys.length - 400).forEach(k => delete S.meta.readDays[k]);
}

function logReading(sec = 0, { tap = false } = {}) {
  const today = dayKey();
  const was = didRead(today);
  const cur = Number(S.meta.readDays[today]) || 0;
  const add = tap ? (cur ? 0 : 1) : Math.max(1, Math.round(sec));
  if (add) {
    S.meta.readDays[today] = cur + add;
    pruneReadDays();
    persistLocal();
    cloudWrite(['meta', 'progress'], { readDays: { [today]: inc(add) }, updatedAt: Date.now() });
  }
  if (!was) addXP(XP.readToday);
  putProfile();
  scheduleRender();
  return { firstToday: !was, streak: streakInfo().streak };
}

// Streak toasts are where emojis are allowed
function celebrateStreak(n) {
  if (n < 1) return;
  const tag = `${n}@${shiftDay(dayKey(), -(n - 1))}`;
  Sound.play('streak');
  haptic([20, 60, 20, 60, 40]);
  if (STREAK_MILESTONES.includes(n) && !S.meta.milestones.includes(tag)) {
    S.meta.milestones = [...S.meta.milestones, tag].slice(-40);
    putMeta();
    confetti(220);
    toast(`🎉 ${n}-day streak unlocked! That's a real reading habit.`, { type: 'celebrate', ic: 'medal', ms: 5500 });
    return;
  }
  toast(n === 1 ? '🔥 Streak started! Read again tomorrow to keep it going.' : `🔥 ${n}-day streak! Keep those pages turning.`, { type: 'celebrate', ic: 'flame' });
}

onAction({
  'read-today': el => {
    if (didRead(dayKey())) return;
    const { streak } = logReading(0, { tap: true });
    UI.flash = { celebrate: true, until: Date.now() + 1400 };
    sparkBurst(el, 18);
    confetti(90);
    celebrateStreak(streak);
    queueReflection({ source: 'tap', bookId: readingBooks()[0]?.id || null }); // V2.1

  },
  'undo-read': () => {
    const k = dayKey();
    if ((Number(S.meta.readDays[k]) || 0) > 1) return; // timed reading can't be undone from here
    delete S.meta.readDays[k];
    persistLocal();
    cloudWrite(['meta', 'progress'], { readDays: { [k]: delField() } });
    addXP(-XP.readToday);
    putProfile();
    scheduleRender();
    toast("Removed today's reading log.", { ic: 'reset' });
  },
  'sign-in': () => signIn(),
  'sign-out': () => signOutUser(),
  'hide-sync-card': () => { prefs.hideSyncCard = true; savePrefs(); scheduleRender(); }
});

function starButtons(act, value, extra = '') {
  return [1, 2, 3, 4, 5].map(v =>
    `<button type="button" class="star${v <= value ? ' on' : ''}" data-act="${act}" data-v="${v}" ${extra} role="radio" aria-checked="${v === value}" aria-label="${plural(v, 'star')}">${icon('star')}</button>`
  ).join('');
}
function paintStars(box, value, prev = 0) {
  if (!box) return;
  $$('.star', box).forEach(s => {
    const v = +s.dataset.v, on = v <= value;
    s.classList.toggle('on', on);
    s.setAttribute('aria-checked', String(v === value));
    s.classList.remove('pop');
    if (on && v > prev) {
      void s.offsetWidth;
      s.style.animationDelay = `${(v - prev - 1) * 60}ms`;
      s.classList.add('pop');
    }
  });
}

/* =====================================================================
   21. READING TIMER — stopwatch (count up) + countdown. Kept on this device,
   based on timestamps, so it survives locking the phone or closing the app.
   ===================================================================== */
const timer = Object.assign(
  { mode: 'stopwatch', bookId: null, minutes: 20, running: false, startedAt: 0, accMs: 0, alerted: false },
  readJSON(STORE.timer, {})
);
if (!COUNTDOWN_PRESETS.includes(timer.minutes)) timer.minutes = 20;
const saveTimer = () => { writeJSON(STORE.timer, timer); syncTimerNote(); }; // V2.1: keeps the background notification in step
const tElapsed = () => timer.accMs + (timer.running ? Date.now() - timer.startedAt : 0);
const tTarget = () => timer.minutes * 60000;
const tActive = () => timer.running || timer.accMs > 0;
let tickHandle = 0;

function ensureTick() {
  if (tickHandle) return;
  tickHandle = setInterval(timerTick, 500);
}
function stopTick() { clearInterval(tickHandle); tickHandle = 0; }

function timerStart() {
  if (timer.running) return;
  if (timer.mode === 'countdown' && tElapsed() >= tTarget()) timer.accMs = 0;
  timer.running = true;
  timer.startedAt = Date.now();
  timer.alerted = false;
  saveTimer();
  ensureTick();
  paintTimer();
  Sound.play('tap');
  haptic([8, 30, 8]);
askTimerAlertsOnce(); // V2.1
}
function timerPause() {
  if (!timer.running) return;
  timer.accMs = tElapsed();
  timer.running = false;
  saveTimer();
  paintTimer();
}
function timerReset() {
  Object.assign(timer, { running: false, accMs: 0, startedAt: 0, alerted: false });
  saveTimer();
  stopTick();
  paintTimer();
}
function timerTick() {
  if (!tActive()) { stopTick(); paintTimer(); return; }
  if (timer.mode === 'countdown' && timer.running && tElapsed() >= tTarget()) { countdownDone(); return; }
  paintTimer();
}
function countdownDone() {
  timer.accMs = tTarget();
  timer.running = false;
  saveTimer();
  stopTick();
  paintTimer();
  if (timer.alerted) return;
  timer.alerted = true;
  saveTimer();
  Sound.play('chime');
  haptic([200, 100, 200, 100, 300]);
  systemNotify('📚 Reading session complete', `You read for ${timer.minutes} minutes. Tap to log your pages.`, 'home', { tag: 'inklit-timer', action: 'timer' }); // V2.1
  toast(`⏰ ${timer.minutes} minutes done! Great focus.`, { type: 'celebrate', ic: 'timer' });
  openSessionSheet();
}

function paintTimer() {
  const ms = tElapsed(), cd = timer.mode === 'countdown', target = tTarget();
  const left = Math.max(0, target - ms);
  const text = cd ? fmtClock(Math.ceil(left / 1000) * 1000) : fmtClock(ms);
  const book = S.books[timer.bookId];
  const tm = $('#tmTime');

  const fl = $('#timerFloat');
  const showFloat = tActive() && !tm && !UI.lessonOpen;
  if (fl) {
    fl.classList.toggle('hidden', !showFloat);
    if (showFloat) {
      $('#tfTime').textContent = text;
      $('#tfDot').classList.toggle('on', timer.running);
      $('#tfBook').textContent = book ? shortTitle(book.title) : timer.running ? 'Reading' : 'Paused';
    }
  }
  if (!tm) return;

  tm.textContent = text;
  const sub = $('#tmSub');
  if (sub) sub.textContent = cd ? (ms >= target ? 'Time is up' : `of ${timer.minutes} min`) : (ms >= target ? 'Goal reached' : `Goal ${timer.minutes} min`);
  const ringEl = $('.tm-ring');
  setRing(ringEl, cd ? left / target : Math.min(1, ms / target));
  ringEl?.classList.toggle('running', timer.running);

  const main = $('#tmMain');
  const state = timer.running ? 'run' : 'idle';
  if (main && main.dataset.state !== state) {
    main.dataset.state = state;
    main.classList.toggle('running', timer.running);
    main.innerHTML = icon(timer.running ? 'pause' : 'play');
  }
  main?.setAttribute('aria-label', timer.running ? 'Pause' : ms ? 'Resume' : 'Start');

  const active = tActive();
  $$('[data-act="tm-mode"], [data-act="tm-preset"]').forEach(b => { b.disabled = active; });
  const save = $('#tmSave'), reset = $('#tmReset');
  if (save) save.disabled = ms < 1000;
  if (reset) reset.disabled = !active;
  const hint = $('#tmHint');
  if (hint) {
    hint.textContent = timer.running ? 'You can close this. The timer keeps going, even with your phone locked.'
      : ms ? 'Paused. Resume, or tap the check to save this session.'
      : cd ? 'Counts down and chimes when the time is up.'
      : 'Counts up while you read. The ring fills when you reach your goal.';
  }
}

function tmBookChips() {
  const reading = readingBooks();
  return reading.map(b => `<button type="button" class="chip${timer.bookId === b.id ? ' on' : ''}" data-act="tm-book" data-id="${esc(b.id)}">${esc(shortTitle(b.title))}</button>`).join('')

    <div class="timer-face">${ring({ pct: 0, size: 230, stroke: 14, color: 'var(--cyan)', cls: 'tm-ring', inner: '<span class="tm-time tnum" id="tmTime">0:00</span><span class="tm-sub" id="tmSub"></span>' })}</div>

    </div>
    <p class="tm-hint" id="tmHint"></p>`,
  { label: 'Reading timer', onClose: () => setTimeout(paintTimer, 260) });
  paintTimer();
  if (tActive()) ensureTick();
  if (startNow && !timer.running) timerStart();
}

// --- Session save popup: page count + "Mark as finished" ---
let sessionDraft = null;
function openSessionSheet() {
  const ms = tElapsed();
  if (ms < 1000) { toast('Start the timer first, then save your session.', { ic: 'timer' }); return; }
  if (timer.running) timerPause();
  const reading = readingBooks();
  let book = S.books[timer.bookId];
  if (!book || book.status !== 'reading') book = reading.length === 1 ? reading[0] : null;
  sessionDraft = { ms: tElapsed(), bookId: book?.id || null };
  const mins = Math.max(1, Math.round(sessionDraft.ms / 60000));
  const showChooser = reading.length > 1 || (reading.length && !book);
  openSheet(`${sheetHead('Save this session', 'check')}
    <div class="session-hero">
      <span class="ses-icon">${icon('clock')}</span>
      <div><div class="ses-time tnum">${fmtClock(sessionDraft.ms)}</div><p class="muted small">${sessionDraft.ms < 60000 ? 'Under a minute' : plural(mins, 'minute')} of reading</p></div>
    </div>

function paintSessionStatus() {
  const d = sessionDraft, b = d && S.books[d.bookId], st = $('#sesStatus');
  if (!b || !st) return;
  const p = clamp(parseInt($('#sesPage')?.value, 10) || 0, 0, b.totalPages || 9999);
  const delta = p - b.currentPage;
  st.className = 'form-status' + (delta > 0 ? ' good' : '');
  st.textContent = delta > 0
    ? `${plural(delta, 'page')} this session${b.totalPages ? `, ${Math.round(p / b.totalPages * 100)}% done` : ''}`
    : (b.totalPages ? `You were on page ${b.currentPage} of ${b.totalPages}.` : `You were on page ${b.currentPage}.`);
}

function commitSession({ finish = false } = {}) {
  const d = sessionDraft;
  if (!d) return {};
  sessionDraft = null;
  const sec = Math.max(1, Math.round(d.ms / 1000));
  const b = d.bookId ? S.books[d.bookId] : null;
  let pages = 0, reachedEnd = false;
  if (b) {
    const typed = parseInt($('#sesPage')?.value, 10);
    const page = finish && b.totalPages ? b.totalPages : clamp(Number.isFinite(typed) ? typed : b.currentPage, 0, b.totalPages || 9999);
    pages = Math.max(0, page - b.currentPage);
    const now = Date.now();
    Object.assign(b, { currentPage: page, readSec: (b.readSec || 0) + sec, sessions: (b.sessions || 0) + 1, lastReadAt: now, updatedAt: now });
    persistLocal();
    cloudWrite(['books', b.id], { currentPage: page, lastReadAt: now, updatedAt: now, readSec: inc(sec), sessions: inc(1) });
    reachedEnd = !finish && b.totalPages > 0 && page >= b.totalPages;
  }
  const { firstToday, streak } = logReading(sec);
     queueReflection({ source: 'timer', bookId: b?.id || null, sec, pages }); // V2.1
  const xp = Math.min(XP.sessionCap, Math.floor(sec / 60) * XP.perMinute);
  if (xp) addXP(xp);
  timerReset();
  Sound.play('success');
  if (firstToday) {
    UI.flash = { celebrate: true, until: Date.now() + 1400 };
    celebrateStreak(streak);
  } else {
    toast(`Saved ${fmtDuration(sec)}${pages ? ` and ${plural(pages, 'page')}` : ''}${xp ? `. +${xp} XP` : ''}.`, { type: 'success', ic: 'clock' });
  }
  putProfile();
  scheduleRender();
  return { bookId: b?.id || null, reachedEnd };
}

   24. SPACED REPETITION — SM-2 grading + lesson queue
   ===================================================================== */
const dueMs = w => toMs(w?.nextDueDate);
const isDue = (w, now = Date.now()) => w.state !== 'new' && dueMs(w) > 0 && dueMs(w) <= now;

// Forgot = grade 1, Kind of knew = grade 3, Knew it = grade 5
function applyGrade(word, grade, now = Date.now()) {
  const w = { ...word, history: [...(word.history || [])] };
  if (grade === 1) {
    w.repetitionCount = 0;
    w.interval = 1;
    w.easeFactor = Math.max(1.3, w.easeFactor - 0.2);
    w.state = 'learning';
  } else if (grade === 3) {
    w.repetitionCount += 1;
    w.interval = w.repetitionCount === 1 ? 1 : w.repetitionCount === 2 ? 3 : Math.round(w.interval * w.easeFactor);
    w.state = 'review';
  } else {
    w.repetitionCount += 1;
    w.interval = w.repetitionCount === 1 ? 3 : w.repetitionCount === 2 ? 6 : Math.round(w.interval * w.easeFactor * 1.3);
    w.easeFactor = w.easeFactor + 0.15;
    w.state = w.interval > MASTERED_AFTER_DAYS ? 'mastered' : 'review';
  }
  w.interval = Math.max(1, w.interval);
  w.easeFactor = Math.round(w.easeFactor * 100) / 100;
  w.lastReviewed = new Date(now).toISOString();
  w.nextDueDate = new Date(daysFromToday(w.interval)).toISOString(); // due at local midnight
  w.seen = (w.seen || 0) + 1;
  w.history = [...w.history, { at: now, g: grade }].slice(-12);
  return w;
}

function vocabCounts() {
  const words = Object.values(S.vocab || {}), now = Date.now();
  return {
    total: words.length,
    due: words.filter(w => isDue(w, now)).length,
    learning: words.filter(w => w.state === 'learning').length,
    review: words.filter(w => w.state === 'review').length,
    mastered: words.filter(w => w.state === 'mastered').length,
    fresh: words.filter(w => w.state === 'new').length,
    studied: words.filter(w => w.state !== 'new').length
  };
}

// Overdue reviews -> learning/failed items -> new words, capped at 7.
// Every 3rd session one mastered word is forced in to keep it fresh.
function buildQueue(sessionNumber) {
  const now = Date.now();
  const all = Object.values(S.vocab);
  const byDue = (a, b) => dueMs(a) - dueMs(b);
  const overdue = all.filter(w => (w.state === 'review' || w.state === 'mastered') && isDue(w, now)).sort(byDue);
  const learning = all.filter(w => w.state === 'learning' && isDue(w, now)).sort(byDue);
  const fresh = all.filter(w => w.state === 'new').sort((a, b) => a.addedAt - b.addedAt);
  const picked = [];
  const take = (list, tag) => {
    for (const w of list) {
      if (picked.length >= BATCH_SIZE) return;
      if (!picked.some(p => p.w.wordId === w.wordId)) picked.push({ w, tag });
    }
  };
  take(overdue, 'review');
  take(learning, 'learning');
  take(fresh, 'new');

  let resurfaced = null;
  if (sessionNumber % RESURFACE_EVERY === 0) {
    const cand = all.filter(w => w.state === 'mastered' && !picked.some(p => p.w.wordId === w.wordId)).sort(byDue)[0];
    if (cand) {
      resurfaced = cand;
      const item = { w: cand, tag: 'resurface' };
      if (picked.length < BATCH_SIZE) picked.push(item);
      else {
        let at = -1;
        for (let k = picked.length - 1; k >= 0; k--) if (picked[k].tag === 'new') { at = k; break; }
        picked[at < 0 ? picked.length - 1 : at] = item;
      }
    }
  }
  return { picked, needNew: Math.max(0, BATCH_SIZE - picked.length), resurfaced };
}

// Exactly one drill type per session, rotated through a shuffled bag so it never repeats back to back
function nextDrill() {
  let bag = (S.meta.drillBag || []).filter(d => DRILL_TYPES.includes(d));
  if (!bag.length) {
    bag = shuffle(DRILL_TYPES);
    if (bag[0] === S.meta.lastDrill) bag.push(bag.shift());
  }
  const drill = bag.shift();
  return { drill, bag };
}

partOfSpeech: noun, verb, adjective or adverb.
pronunciation: a simple respelling with the stressed syllable in capitals, like ih-FEM-er-uhl.
definition: plain language, under 14 words.
example: one vivid sentence that uses the exact base form.
clue: a different sentence with a strong context clue, where the word is replaced by ____ (four underscores).

Wrap each of those words in **double asterisks** every time it appears. Keep it warm, vivid and easy to follow. If you write a dialogue, put each line on its own line. Also give it a short title.`;

Target word: "${w.word}" (${w.pos}), meaning: ${w.def}
<sentence>${text.replace(/[<>]/g, '')}</sentence>

feedback: one or two short, warm sentences. If ok, say what works. If not, name the single fix that would make it work. Never be sarcastic.`;

function geminiWord(r) {
  if (!r || typeof r.word !== 'string') return null;
  const word = r.word.trim().toLowerCase();
  if (!/^[a-z][a-z-]{2,24}$/.test(word)) return null;
  const str = k => (typeof r[k] === 'string' ? r[k].trim() : '');
  const blank = s => s.replace(/_{3,}/g, '____');
  const def = str('definition'), example = str('example'), right = str('correctUsage');
  const clue = blank(str('clue')), colloc = blank(str('collocation'));
  const wrong = (Array.isArray(r.wrongUsages) ? r.wrongUsages : []).map(s => String(s).trim()).filter(s => s && usesWord(s, word));
  if (!def || !usesWord(example, word) || !clue.includes('____') || !colloc.includes('____') || wrong.length < 2) return null;
  return normalizeWord({
    word, pos: str('partOfSpeech').toLowerCase(), pron: str('pronunciation'), def, example, clue, colloc,
    right: usesWord(right, word) ? right : '', wrong: wrong.slice(0, 2), src: 'gemini', state: 'new', addedAt: Date.now()
  });
}

async function fetchNewWords(n) {
  const known = new Set(Object.values(S.vocab).map(w => w.word));
  let list = [], note = '';
  if (hasAI()) {
    try {
      const data = await askGemini(wordsPrompt(Math.max(n, BATCH_SIZE), [...known].slice(-300)), WORDS_SCHEMA, { temperature: 0.9, maxTokens: 4096, timeoutMs: 25000 });
      const seen = new Set();
      list = (data?.words || []).map(geminiWord).filter(w => w && !known.has(w.word) && !seen.has(w.word) && seen.add(w.word));
    } catch (e) { note = aiErrorText(e); }
  }
  if (list.length < n) {
    const bank = shuffle(WORD_BANK.filter(e => !known.has(e.word) && !list.some(w => w.word === e.word)));
    list = list.concat(bank.slice(0, n - list.length).map(e => bankWord(e)));
  }
  if (list.length) putWords(list); // extras stay "new" for the next lesson
  return { words: list, note };
}

async function makeStory(words) {
  if (hasAI()) {
    try {
      const data = await askGemini(storyPrompt(words), STORY_SCHEMA, { temperature: 0.9, maxTokens: 1200, timeoutMs: 20000 });
      const text = String(data?.story || '').trim();
      const plain = text.replace(/\*\*/g, '');
      if (text && words.every(w => usesWord(plain, w.word))) {
        return { title: String(data.title || "Today's story").slice(0, 80), html: markStory(text, words), plain, src: 'gemini' };
      }
    } catch (e) { console.info('[InkLit] story fallback:', e?.message); }
  }
  return localStory(words);
}
function localStory(words) {
  const allBank = words.every(w => w.src === 'bank');
  const lines = words.map(w => w.example).filter(Boolean);
  const parts = allBank ? [pickOne(STORY_FRAME.intros), ...lines, pickOne(STORY_FRAME.outros)] : ["Here is how today's words show up in real sentences.", ...lines];
  const text = parts.join(' ');
  return { title: allBank ? 'A week in Wren Harbor' : "Today's words in action", html: markStory(text, words), plain: text, src: 'local' };
}

function localCheck(text, w) {
  const words = text.split(/\s+/).filter(Boolean);
  const squash = s => String(s).toLowerCase().replace(/[^a-z ]/g, '').trim();
  if (!usesWord(text, w.word)) return { ok: false, feedback: `Make sure "${w.word}" appears in your sentence.` };
  if (words.length < 5) return { ok: false, feedback: 'Add a little more so the sentence shows what the word means. Aim for at least 5 words.' };
  if (new Set(words.map(x => x.toLowerCase())).size / words.length < 0.6) return { ok: false, feedback: 'Try a real sentence about something you can picture.' };
  if ([w.example, w.right].some(s => s && squash(s) === squash(text))) return { ok: false, feedback: "That one's from the card. Try an idea of your own!" };
  return { ok: true, feedback: `You used "${w.word}" in a sentence of your own. Nice!` };
}

/* =====================================================================
   26. LESSON PLAYER — Meet, Recall, Story, one Drill, Wrap-up
   ===================================================================== */
let L = null;
let lessonToken = 0;
const TAG_INFO = { new: ['blue', 'New'], review: ['cyan', 'Review'], learning: ['amber', 'Practice'], resurface: ['purple', 'Resurfaced'] };
const STATE_TAG = { new: ['blue', 'New'], learning: ['amber', 'Learning'], review: ['green', 'Reviewing'], mastered: ['purple', 'Mastered'] };
const GRADE_TEXT = { 1: 'Forgot', 3: 'Kind of knew', 5: 'Knew it' };
const GOOD_LINES = ['Nice work!', 'Nailed it!', 'Exactly right!', 'You got it!', 'Spot on!'];
const tagHTML = tag => { const [c, t] = TAG_INFO[tag] || TAG_INFO.new; return `<span class="tag ${c}">${t}</span>`; };
const stateTag = st => { const [c, t] = STATE_TAG[st] || STATE_TAG.new; return `<span class="tag ${c}">${t}</span>`; };

function hlSentence(sentence, word) {
  const s = String(sentence || '');
  const form = findWordForm(s, word);
  if (!form) return esc(s);
  const m = s.match(new RegExp(`(^|[^A-Za-z])${escapeRe(form)}(?![A-Za-z])`));
  if (!m) return esc(s);
  const at = m.index + m[1].length;
  return `${esc(s.slice(0, at))}<mark class="hl">${esc(form)}</mark>${esc(s.slice(at + form.length))}`;
}
function blankHTML(text, filled = '', state = '') {
  const [a, ...rest] = String(text).split('____');
  return `${esc(a)}<span class="blank${filled ? ` filled ${state}` : ''}">${filled ? esc(filled) : '&nbsp;'}</span>${esc(rest.join('____'))}`;
}
const clueFor = w => (w.clue && w.clue.includes('____')) ? w.clue : (blankSentence(w.example, w.word)?.text || '');
function collocFor(w) {
  if (w.colloc && w.colloc.includes('____')) return { text: w.colloc, answer: w.word };
  const b = blankSentence(w.example, w.word) || blankSentence(w.right, w.word);
  return b ? { text: b.text, answer: b.answer } : { text: `____ means: ${w.def}`, answer: w.word };
}
function usageOptions(w, batch) {
  const right = w.right && usesWord(w.right, w.word) ? w.right : w.example;
  const wrong = (w.wrong || []).filter(Boolean).slice(0, 2);
  // Missing misuses: drop this word into another word's sentence
  for (const o of shuffle(batch)) {
    if (wrong.length >= 2) break;
    if (o.word === w.word) continue;
    const b = blankSentence(o.example, o.word);
    if (b) wrong.push(b.text.replace('____', w.word));
  }
  return shuffle([{ t: right, ok: true }, ...wrong.slice(0, 2).map(t => ({ t, ok: false }))]);
}
function distractors(w, n, batch) {
  const out = [];
  const add = list => {
    for (const x of shuffle(list)) {
      if (out.length >= n) return;
      const word = x?.word;
      if (word && word !== w.word && !out.includes(word)) out.push(word);
    }
  };
  add(batch.filter(x => x.pos === w.pos));
  add(batch);
  add(Object.values(S.vocab));
  add(WORD_BANK);
  return out;
}
function currentWord() {
  if (!L) return null;
  if (L.phase === 0) return L.items[L.i]?.w;
  if (L.phase === 1) return L.items[L.deck[L.i]]?.w;
  if (L.phase === 3) return L.items[L.drillItems[L.i]?.k]?.w;
  return null;
}

function openLessonShell() {

function stopMic() {

async function requestCloseLesson(fromHistory = false) {
  const inProgress = L && L.phase < 4 && (L.phase > 0 || L.i > 0 || L.flipped);
  if (!inProgress) { closeLessonNow(fromHistory); return; }
  if (fromHistory) pushLayer('lesson', () => requestCloseLesson(true)); // keep it open while we ask
  const ok = await confirmSheet({
    title: 'Leave this lesson?', ic: 'alert', confirm: 'Leave lesson', cancel: 'Keep going', danger: true,
    text: "Your grades from this lesson aren't saved until the wrap-up. You can start again any time."
  });

}

async function startLesson() {
  const token = ++lessonToken;
  stopLessonAudio();
  if (!$('#lesson-root').children.length) openLessonShell();
  L = null;
  setLessonLoading('Getting your words ready…');

  const sessionNumber = (S.meta.sessionCount || 0) + 1;
  const q = buildQueue(sessionNumber);
  const items = q.picked.slice();
  let note = '';
  if (q.needNew > 0) {
    setLessonLoading(hasAI() ? 'Inky is picking fresh words for you…' : 'Picking your next words…');
    const res = await fetchNewWords(q.needNew);
    if (token !== lessonToken) return;
    note = res.note;
    res.words.slice(0, q.needNew).forEach(w => items.push({ w, tag: 'new' }));
  }
  if (token !== lessonToken) return;
  if (!items.length) { renderLessonEmpty(); return; }

  const { drill, bag } = nextDrill();
  S.meta.drillBag = bag;
  S.meta.lastDrill = drill;
  putMeta();

  L = {
    id: randomId('ls'), token, sessionNumber, drill,
    phase: 0, i: 0, flipped: false, deck: [], drillItems: [], answered: null,
    xp: 0, correct: 0, answers: 0, story: null, mic: null, prodMode: canListen ? 'voice' : 'text',
    items: items.map(({ w, tag }) => ({ w: { ...w }, tag, g: null, retries: 0, drillOk: null }))
  };
  makeStory(L.items.map(it => it.w)).then(story => {
    if (!L || L.token !== token) return;
    L.story = story;
    if (L.phase === 2) renderLesson();
  });
  renderLesson();
  if (note && hasAI()) toast(`${note}, so these words come from the built-in list.`, { ic: 'info' });
}

function renderLessonEmpty() {
  L = null;

}

function phaseFraction() {
  switch (L.phase) {
    case 0: return L.i / L.items.length;
    case 1: return L.deck.length ? L.i / L.deck.length : 0;
    case 2: return L.story ? 0.5 : 0.15;
    case 3: return L.drillItems.length ? L.i / L.drillItems.length : 0;
    default: return 1;
  }
}
function paintLessonTop() {
  const frac = phaseFraction();
  $$('#lsPhases .phase-seg').forEach((seg, i) => {
    const done = i < L.phase || L.phase === 4;
    seg.classList.toggle('done', done);
    seg.classList.toggle('cur', i === L.phase && L.phase < 4);
    seg.querySelector('i').style.width = `${done ? 100 : i === L.phase ? Math.round(frac * 100) : 0}%`;
  });
  const xp = $('#lsXp span');
  if (xp) xp.textContent = L.phase === 4 ? L.xpTotal : L.xp;
}

function renderLesson({ footOnly = false } = {}) {
  if (!L) return;
  const body = $('#lsBody'), foot = $('#lsFoot');
  if (!body || !foot) return;
  if (!footOnly) stopMic();
  paintLessonTop();
  const view = [viewMeet, viewRecall, viewStory, viewDrill, viewSummary][L.phase]();
  if (!footOnly) { body.innerHTML = `<div class="lesson-inner">${view.main}</div>`; body.scrollTop = 0; }
  foot.innerHTML = `<div class="lesson-inner">${view.footer}</div>`;
}

// Phase 1 — exposure + vocal introduction
function viewMeet() {

// Phase 4 — exactly one production drill per session
function prepareDrill() {
  const batch = L.items.map(it => it.w);
  if (L.drill === 'collocation') {
    L.drillItems = L.items.map((it, k) => {
      const c = collocFor(it.w);
      return { k, text: c.text, answer: c.answer, options: shuffle([it.w.word, ...distractors(it.w, 3, batch)]) };
    });
  } else if (L.drill === 'errorspot') {
    L.drillItems = L.items.map((it, k) => ({ k, options: usageOptions(it.w, batch) }));
  } else {
    L.drillItems = L.items.map((it, k) => ({ k, g: it.g ?? 3, r: Math.random() }))
      .sort((a, b) => a.g - b.g || a.r - b.r).slice(0, PRODUCTION_WORDS)
      .map(o => ({ k: o.k, text: '', result: null, checking: false }));
  }
  L.i = 0;
  L.answered = null;
}

function optState(a, i, isCorrect) {
  if (!a) return '';
  return ' locked' + (isCorrect ? ' correct' : i === a.pick ? ' wrong' : ' dim');
}
const feedbackHTML = (ok, title, text) =>
  `<div class="feedback ${ok ? 'good' : 'bad'}">${icon(ok ? 'check' : 'info')}<div><b>${esc(title)}</b><p>${esc(text)}</p></div></div>`;
const continueBtn = label => `<button type="button" class="btn btn-primary btn-lg btn-block" data-act="ls-drill-next">${icon('arrowRight')} ${esc(label)}</button>`;

function viewDrill() {
  const d = L.drillItems[L.i], it = L.items[d.k], w = it.w;
  const last = L.i === L.drillItems.length - 1;
  const nextLabel = last ? 'See my results' : 'Continue';
  const head = `<p class="phase-label">Phase 4 · ${esc(DRILL_INFO[L.drill].name)}</p>`;
  const counter = `<p class="counter">Question ${L.i + 1} of ${L.drillItems.length}</p>`;
  const a = L.answered;

  if (L.drill === 'collocation') {
    const filled = a ? (a.ok ? d.answer : d.options[a.pick]) : '';
    return {
      main: `${head}<h2 class="prompt-title">Fill in the blank.</h2>
        <div class="card drill-card"><p class="blank-sentence">${blankHTML(d.text, filled, a ? (a.ok ? 'ok' : 'no') : '')}</p></div>
        <div class="opt-grid">${d.options.map((o, i) => `<button type="button" class="opt word-opt${optState(a, i, o === w.word)}" data-act="ls-pick" data-i="${i}">${esc(o)}</button>`).join('')}</div>
        ${a ? feedbackHTML(a.ok, a.line, a.ok ? `${w.word}: ${w.def}` : `The answer is "${w.word}", which means: ${w.def}`) : ''}
        ${counter}`,
      footer: a ? continueBtn(nextLabel) : '<p class="foot-hint">Pick the word that fits best.</p>'
    };
  }

  if (L.drill === 'errorspot') {
    const right = d.options.findIndex(o => o.ok);
    return {
      main: `${head}<h2 class="prompt-title">Which sentence uses <mark class="hl">${esc(w.word)}</mark> correctly?</h2>
        <p class="muted def-hint">${w.pos ? `${esc(w.pos)} · ` : ''}${esc(w.def)}</p>
        <div class="opt-list">${d.options.map((o, i) => `<button type="button" class="opt${optState(a, i, o.ok)}" data-act="ls-pick" data-i="${i}"><span class="opt-letter">${'ABC'[i]}</span><span>${hlSentence(o.t, w.word)}</span></button>`).join('')}</div>
        ${a ? feedbackHTML(a.ok, a.line, a.ok ? `That's exactly how "${w.word}" is used.` : `Sentence ${'ABC'[right]} is the right one. "${w.word}" means: ${w.def}`) : ''}
        ${counter}`,
      footer: a ? continueBtn(nextLabel) : '<p class="foot-hint">Tap the sentence that uses the word correctly.</p>'
    };
  }

  // Original sentence production (voice or text)
  const r = d.result;
  const voice = L.prodMode === 'voice';
  const main = `${head}<h2 class="prompt-title">Use <mark class="hl">${esc(w.word)}</mark> in your own sentence.</h2>
    <p class="muted def-hint">${w.pos ? `${esc(w.pos)} · ` : ''}${esc(w.def)}</p>
    ${canListen ? `<div class="seg" role="tablist" aria-label="Answer mode">
      <button type="button" role="tab" data-act="ls-prod-mode" data-mode="voice" class="${voice ? 'on' : ''}" aria-selected="${voice}">${icon('mic')} Speak</button>
      <button type="button" role="tab" data-act="ls-prod-mode" data-mode="text" class="${voice ? '' : 'on'}" aria-selected="${!voice}">${icon('keyboard')} Type</button></div>` : ''}
    ${voice ? `<button type="button" class="mic-big" data-act="ls-prod-mic" ${r?.ok ? 'disabled' : ''}>${icon('mic')}<span id="prodMicLabel">${d.text ? 'Tap to record again' : 'Tap, then say your sentence'}</span></button>` : ''}
    <textarea class="field prod-text" id="prodText" rows="3" maxlength="300" data-input="prod-text" placeholder="${voice ? 'Your words appear here, and you can edit them.' : `Write a sentence that uses "${esc(w.word)}"`}" ${r?.ok ? 'readonly' : ''}>${esc(d.text)}</textarea>
    <div id="lsFeedback">${r ? feedbackHTML(r.ok, r.title, r.feedback) + (r.src === 'local' ? `<p class="counter">Checked by Inky's offline helper${hasAI() ? '' : '. Add a Gemini key for AI feedback.'}</p>` : '') : ''}</div>
    ${counter}`;
  let footer;
  if (d.checking) footer = `<button type="button" class="btn btn-primary btn-lg btn-block" disabled>${icon('sparkles')} Checking…</button>`;
  else if (r?.ok) footer = continueBtn(nextLabel);
  else if (r) footer = `<div class="foot-split"><button type="button" class="btn btn-ghost btn-lg" data-act="ls-drill-next">${last ? 'Results' : 'Skip'}</button><button type="button" class="btn btn-primary btn-lg" data-act="ls-prod-retry">${icon('refresh')} Try again</button></div>`;
  else footer = `<div class="foot-split"><button type="button" class="btn btn-ghost btn-lg" data-act="ls-drill-next">Skip</button><button type="button" class="btn btn-primary btn-lg" id="prodCheck" data-act="ls-prod-check" ${d.text.trim() ? '' : 'disabled'}>${icon('check')} Check it</button></div>`;
  return { main, footer };
}

async function checkProduction() {
  const idx = L.i, token = L.token;
  const d = L.drillItems[idx], it = L.items[d.k], w = it.w;
  const text = ($('#prodText')?.value || '').trim().slice(0, 300);
  d.text = text;
  if (!text) return;
  stopMic();
  d.checking = true;
  renderLesson({ footOnly: true });
  let r = null;
  if (hasAI()) {
    try {
      const data = await askGemini(checkPrompt(text, w), CHECK_SCHEMA, { temperature: 0.3, maxTokens: 300, timeoutMs: 15000 });
      const ok = data?.ok === true && usesWord(text, w.word);
      r = { ok, feedback: String(data?.feedback || '').slice(0, 280) || (ok ? 'That works.' : 'Give it one more try.'), src: 'gemini' };
    } catch {}
  }
  if (!r) r = { ...localCheck(text, w), src: 'local' };
  if (!L || L.token !== token || L.phase !== 3 || L.i !== idx) return;
  d.checking = false;
  r.title = r.ok ? pickOne(GOOD_LINES) : 'Almost there.';
  if (it.drillOk === null) {
    it.drillOk = r.ok;
    L.answers++;
    if (r.ok) { L.correct++; L.xp += XP.perCorrect; }
  }
  d.result = r;
  Sound.play(r.ok ? 'good' : 'bad');
  haptic(r.ok ? [10, 30, 10] : [30, 40, 30]);
  renderLesson();
}

// Phase 5 — grade, schedule, celebrate
function finishLesson() {
  const now = Date.now(), before = {};
  const updated = L.items.map(it => {
    let g = it.g ?? 3;
    if (it.drillOk === false) g = g === 5 ? 3 : 1; // a missed drill pulls the grade down one step
    it.finalG = g;
    const base = S.vocab[it.w.wordId] || it.w;
    before[base.wordId] = base.state;
    it.after = applyGrade(base, g, now);
    return it.after;
  });
  putWords(updated);

  S.meta.sessionCount = (S.meta.sessionCount || 0) + 1;
  persistLocal();
  cloudWrite(['meta', 'progress'], { sessionCount: inc(1) });
  L.acc = L.answers ? Math.round(L.correct / L.answers * 100) : 100;
  L.xpTotal = L.xp + XP.lesson;
  S.meta.lessons = [...S.meta.lessons, { id: L.id, at: now, words: L.items.map(it => it.w.word), acc: L.acc, xp: L.xpTotal, drill: L.drill, n: L.items.length }].slice(-30);
  putMeta();
  addXP(L.xpTotal);
  putProfile();

  L.phase = 4;
  L.i = 0;
  renderLesson();
  confetti(160);
  Sound.play('success');
  haptic([20, 60, 20]);
  const newlyMastered = updated.filter(w => w.state === 'mastered' && before[w.wordId] !== 'mastered');
  if (newlyMastered.length) {
    setTimeout(() => toast(`🎉 Mastered: ${newlyMastered.map(w => w.word).join(', ')}! That word is yours for good.`, { type: 'celebrate', ic: 'medal', ms: 5200 }), 700);
  }
  scheduleRender();
}

      <div class="sstat"><span>Points</span><div class="sbig blue">${icon('bolt')}+${L.xpTotal}</div></div>

function updateProdCheck() {
  const d = L?.drillItems[L.i], btn = $('#prodCheck');
  if (d && btn) btn.disabled = !d.text.trim();
}

onInput({
  'prod-text': el => {
    if (!L || L.phase !== 3) return;
    L.drillItems[L.i].text = el.value;
    updateProdCheck();
  }
});

onAction({
  'start-lesson': () => { if (!UI.lessonOpen) startLesson(); },
  'lesson-close': () => requestCloseLesson(false),
  'lesson-done': () => closeLessonNow(false),
  'lesson-more': () => startLesson(),
  'ls-flip': () => {
    if (!L || L.phase > 1) return;
    L.flipped = !L.flipped;
    $('#lsCard')?.classList.toggle('flipped', L.flipped);
    $('#lsSpeakAns')?.classList.toggle('hidden', !L.flipped);
    Sound.play('flip');
    haptic(10);
    renderLesson({ footOnly: true });
  },
  'ls-next': () => {
    if (!L || L.phase !== 0 || !L.flipped) return;
    L.i++;
    L.flipped = false;
    if (L.i >= L.items.length) {
      L.phase = 1;
      L.i = 0;
      L.deck = shuffle(L.items.map((_, k) => k));
      Sound.play('success');
    } else Sound.play('tap');
    renderLesson();
  },
  'ls-grade': el => {
    if (!L || L.phase !== 1 || !L.flipped) return;
    const g = Number(el.dataset.g), idx = L.deck[L.i], it = L.items[idx];
    if (it.g == null) {
      it.g = g;
      L.answers++;
      if (g >= 3) { L.correct++; L.xp += g === 5 ? XP.perCorrect : Math.ceil(XP.perCorrect / 2); }
    }
    if (g === 1 && it.retries < 2) { it.retries++; L.deck.push(idx); } // back into this session's review buffer
    Sound.play(g === 5 ? 'good' : g === 3 ? 'tap' : 'bad');
    haptic(g === 1 ? [10, 40, 10] : 10);
    L.i++;
    L.flipped = false;
    if (L.i >= L.deck.length) { L.phase = 2; L.i = 0; Sound.play('success'); }
    renderLesson();
  },
  'ls-speak': el => {
    if (!L) return;
    if (el.dataset.what === 'story' && L.story) speak(L.story.plain, 0.95);
    else { const w = currentWord(); if (w) speak(w.word, 0.85); }
  },
  'ls-mic': el => {
    if (!L) return;
    if (L.mic) { stopMic(); return; }
    const w = currentWord(), heard = $('#lsHeard');
    if (!w || !heard) return;
    let matched = false;
    el.classList.add('listening');
    heard.className = 'heard';
    heard.textContent = 'Listening…';
    L.mic = listen({
      onText: (text, alts) => {
        heard.textContent = `I heard "${text}"`;
        if (!matched && alts.some(t => saidMatches(t, w.word))) {
          matched = true;
          heard.className = 'heard good';
          heard.textContent = L?.phase === 0 ? `Sounds right: "${w.word}"` : `Yes, it's "${w.word}"!`;
          Sound.play('good');
          haptic([10, 30, 10]);
          L?.mic?.stop();
          if (L?.phase === 1 && !L.flipped) setTimeout(() => ACTIONS['ls-flip'](), 450);
        }
      },
      onEnd: () => {
        el.classList.remove('listening');
        if (L) L.mic = null;
        if (matched) return;
        heard.textContent = heard.textContent === 'Listening…'
          ? "I didn't catch that. Try again a little closer to the mic."
          : `${heard.textContent}. Close! Try once more, or just tap the card.`;
      },
      onError: err => {
        if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(err)) heard.textContent = 'Microphone access is off. Say it to yourself and tap the card.';
        else if (err === 'network') heard.textContent = 'Voice check needs an internet connection.';
      }
    });
    if (!L.mic) { el.classList.remove('listening'); heard.textContent = "Voice check isn't available in this browser."; }
  },
  'word-tip': el => {
    const it = L?.items.find(x => x.w.wordId === el.dataset.w), tip = $('#wordTip');
    if (!it || !tip) return;
    tip.innerHTML = `<b>${esc(it.w.word)}</b>${it.w.pos ? ` · ${esc(it.w.pos)}` : ''} · ${esc(it.w.def)}`;
    speak(it.w.word, 0.85);
  },
  'ls-story-done': () => {
    if (!L?.story) return;
    stopLessonAudio();
    L.phase = 3;
    prepareDrill();
    Sound.play('tap');
    renderLesson();
  },
  'ls-pick': el => {
    if (!L || L.phase !== 3 || L.answered || L.drill === 'production') return;
    const d = L.drillItems[L.i], it = L.items[d.k], i = Number(el.dataset.i);
    const ok = L.drill === 'collocation' ? d.options[i] === it.w.word : !!d.options[i]?.ok;
    L.answered = { pick: i, ok, line: ok ? pickOne(GOOD_LINES) : 'Not quite.' };
    it.drillOk = ok;
    L.answers++;
    if (ok) { L.correct++; L.xp += XP.perCorrect; sparkBurst(el, 10); }
    Sound.play(ok ? 'good' : 'bad');
    haptic(ok ? [10, 30, 10] : [30, 40, 30]);
    renderLesson();
  },
  'ls-drill-next': () => {
    if (!L || L.phase !== 3) return;
    stopMic();
    L.i++;
    L.answered = null;
    if (L.i >= L.drillItems.length) finishLesson();
    else { Sound.play('tap'); renderLesson(); }
  },
  'ls-prod-mode': el => {
    if (!L || L.phase !== 3) return;
    const d = L.drillItems[L.i];
    d.text = $('#prodText')?.value || d.text;
    L.prodMode = el.dataset.mode === 'voice' && canListen ? 'voice' : 'text';
    renderLesson();
    if (L.prodMode === 'text') $('#prodText')?.focus();
  },
  'ls-prod-mic': el => {
    if (!L || L.phase !== 3) return;
    if (L.mic) { L.mic.stop(); return; }
    const d = L.drillItems[L.i], ta = $('#prodText'), label = $('#prodMicLabel');
    el.classList.add('listening');
    if (label) label.textContent = 'Listening… tap to stop';
    L.mic = listen({
      onText: text => { d.text = text; if (ta) ta.value = text; updateProdCheck(); },
      onEnd: () => {
        el.classList.remove('listening');
        if (L) L.mic = null;
        if (label) label.textContent = d.text ? 'Tap to record again' : 'Tap, then say your sentence';
      },
      onError: err => {
        if (label && ['not-allowed', 'service-not-allowed', 'audio-capture'].includes(err)) label.textContent = 'Microphone access is off. Switch to Type.';
      }
    });
    if (!L.mic) { el.classList.remove('listening'); if (label) label.textContent = "Voice input isn't available here. Switch to Type."; }
  },
  'ls-prod-check': () => { if (L?.phase === 3) return checkProduction(); },
  'ls-prod-retry': () => {
    if (!L || L.phase !== 3) return;
    L.drillItems[L.i].result = null;
    renderLesson();
    $('#prodText')?.focus();
  }
});

/* =====================================================================
   28. FRIENDS & STREAKS — real connections only (invite codes), high fives + cheers
   ===================================================================== */
const CHEERS_KEY = 'inklit:v2:cheersSent';
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const social = { unsubs: [], friendUnsubs: {}, seenCheers: new Set(), sent: {} };
(() => {
  const today = dayKey(), saved = readJSON(CHEERS_KEY, {});
  Object.entries(saved && typeof saved === 'object' ? saved : {}).forEach(([fid, d]) => { if (d === today) social.sent[fid] = d; });
})();

const avatarInner = (photo, name) => photo && /^https:\/\//.test(photo)
  ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">` : esc(initialOf(name));

function friendStatus(p) {
  let today = dayKey();
  try { if (p?.tz) today = new Date().toLocaleDateString('en-CA', { timeZone: p.tz }); } catch {}
  const readToday = p?.lastRead === today;
  const alive = readToday || p?.lastRead === shiftDay(today, -1);
  return { readToday, streak: alive ? Number(p.streak) || 0 : 0 };
}

function startSocial(user) {
  stopSocial();
  if (!FB.db || !user) return;
  const F = FB.F, uid = user.uid;
  social.unsubs.push(F.onSnapshot(F.collection(FB.db, 'users', uid, 'friends'), snap => {
    if (S.uid !== uid) return;
    const next = {};
    snap.forEach(d => { next[d.id] = { uid: d.id, ...d.data() }; });
    S.friends = next;
    syncFriendListeners(uid);
    scheduleRender();
  }, err => console.warn('[InkLit] friends listener', err?.code)));

  const unseen = F.query(F.collection(FB.db, 'users', uid, 'cheers'), F.where('seen', '==', false));
  social.unsubs.push(F.onSnapshot(unseen, snap => {
    if (S.uid !== uid) return;
    snap.docChanges().forEach(ch => { if (ch.type === 'added') onCheer(ch.doc); });
  }, err => console.warn('[InkLit] cheers listener', err?.code)));
}

function stopSocial() {
  social.unsubs.forEach(u => { try { u(); } catch {} });
  social.unsubs = [];
  Object.values(social.friendUnsubs).forEach(u => { try { u(); } catch {} });
  social.friendUnsubs = {};
  S.friends = {};
  S.friendProfiles = {};
  S.cheers = [];
}

function syncFriendListeners(uid) {
  const F = FB.F;
  Object.keys(social.friendUnsubs).forEach(fid => {
    if (S.friends[fid]) return;
    try { social.friendUnsubs[fid](); } catch {}
    delete social.friendUnsubs[fid];
    delete S.friendProfiles[fid];
  });
  Object.keys(S.friends).forEach(fid => {
    if (social.friendUnsubs[fid]) return;
    social.friendUnsubs[fid] = F.onSnapshot(F.doc(FB.db, 'users', fid), snap => {
      if (S.uid !== uid) return;
      S.friendProfiles[fid] = snap.exists() ? snap.data() : { missing: true };
      scheduleRender();
    }, err => {
      S.friendProfiles[fid] = { blocked: true };
      console.info('[InkLit] friend profile unavailable', err?.code);
      scheduleRender();
    });
  });
}

// Incoming cheers: celebratory toast (emoji allowed), a system notification if the app is in the background
const cheerQueue = [];
let cheerTimer = 0;
function onCheer(doc) {
  if (social.seenCheers.has(doc.id)) return;
  social.seenCheers.add(doc.id);
  const c = doc.data() || {};
  cheerQueue.push({ name: String(c.fromName || 'A friend').slice(0, 40), kind: c.kind === 'highfive' ? 'highfive' : 'cheer' });
  try { FB.F.setDoc(doc.ref, { seen: true, seenAt: Date.now() }, { merge: true }).catch(() => {}); } catch {}
  clearTimeout(cheerTimer);
  cheerTimer = setTimeout(flushCheers, 250);
}
function flushCheers() {
  const list = cheerQueue.splice(0);
  if (!list.length) return;
  const one = list[0];
  const msg = list.length === 1
    ? (one.kind === 'highfive' ? `🙌 ${one.name} sent you a high five!` : `📣 ${one.name} is cheering you on. Time to read!`)
    : `🎉 ${list.length} cheers from your reading buddies!`;
  toast(msg, { type: 'celebrate', ic: 'hand', ms: 5200 });
  Sound.play('cheer');
  confetti(80);
  haptic([20, 40, 20]);
  if (document.hidden) {
    const title = list.length === 1 ? (one.kind === 'highfive' ? '🙌 High five!' : '📣 You got a cheer!') : '🎉 New cheers';
    systemNotify(title, msg.replace(/^\S+\s/, ''), 'friends');
  }
}

async function sendCheer(fid, el) {
  if (!cloudOn() || !S.friends[fid]) return;
  const p = S.friendProfiles[fid] || {};
  const kind = friendStatus(p).readToday ? 'highfive' : 'cheer';
  const name = p.name || S.friends[fid].name || 'your friend';
  const today = dayKey();
  if (social.sent[fid] === today) { toast(`You already cheered ${name} today. Send another tomorrow!`, { ic: 'hand' }); return; }
  social.sent[fid] = today;
  writeJSON(CHEERS_KEY, social.sent);
  el.classList.add('pop');
  sparkBurst(el, 16);
  Sound.play('cheer');
  haptic([10, 30, 10]);
  toast(kind === 'highfive' ? `🙌 High five sent to ${name}!` : `📣 Cheer sent to ${name}!`, { type: 'celebrate', ic: kind === 'highfive' ? 'hand' : 'sparkles' });
  setTimeout(scheduleRender, 700);
  try {
    await FB.F.addDoc(FB.F.collection(FB.db, 'users', fid, 'cheers'), {
      from: S.uid, fromName: S.profile.name || 'A friend', fromPhoto: S.profile.photo || '', kind, createdAt: Date.now(), seen: false
    });
  } catch (e) {
    delete social.sent[fid];
    writeJSON(CHEERS_KEY, social.sent);
    scheduleRender();
    toast(e?.code === 'permission-denied' ? "Couldn't send that. Your friend may need to reconnect with you." : "Couldn't send that cheer. Try again in a moment.", { type: 'error' });
  }
}

function friendsToCheer() {
  const today = dayKey();
  return Object.keys(S.friends).filter(fid => {
    const p = S.friendProfiles[fid];
    return p && !p.blocked && !p.missing && friendStatus(p).readToday && social.sent[fid] !== today;
  }).length;
}

// --- Invite codes ---
function makeCode() {
  const a = new Uint32Array(6);
  crypto.getRandomValues(a);
  return [...a].map(n => CODE_ALPHABET[n % CODE_ALPHABET.length]).join('');
}
let codeBusy = false;
async function ensureInviteCode() {
  if (codeBusy || !cloudOn() || S.profile.inviteCode || !cloudFirst.profile) return;
  codeBusy = true;
  try {
    for (let tries = 0; tries < 6; tries++) {
      const code = makeCode();
      const ref = FB.F.doc(FB.db, 'inviteCodes', code);
      const existing = await FB.F.getDoc(ref).catch(() => null);
      if (existing?.exists()) continue;
      try {
        await FB.F.setDoc(ref, { uid: S.uid, name: S.profile.name || '', createdAt: Date.now() });
      } catch (e) {
        if (e?.code === 'permission-denied') continue; // taken by someone else
        throw e;
      }
      S.profile.inviteCode = code;
      persistLocal();
      cloudWrite([], { inviteCode: code });
      scheduleRender();
      break;
    }
  } catch (e) {
    console.warn('[InkLit] invite code', e);
  } finally {
    codeBusy = false;
  }
}

async function addFriendByCode() {
  const st = $('#friendStatus'), btn = $('#friendGo');
  if (!st || btn?.disabled) return;
  const code = ($('#friendCode')?.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const fail = msg => { st.className = 'form-status bad'; st.textContent = msg; Sound.play('bad'); if (btn) btn.disabled = false; };
  if (code.length !== 6) return fail('Invite codes have 6 letters and numbers.');
  if (!cloudOn()) return fail('Sign in first to add friends.');
  if (code === S.profile.inviteCode) return fail("That's your own code. Share it with a friend instead.");
  if (btn) btn.disabled = true;
  st.className = 'form-status';
  st.textContent = 'Looking for that reader…';
  try {
    const F = FB.F;
    const snap = await F.getDoc(F.doc(FB.db, 'inviteCodes', code));
    if (!snap.exists()) return fail('No reader has that code. Check it and try again.');
    const { uid: fid, name = '' } = snap.data() || {};
    if (!fid || fid === S.uid) return fail("That's your own code.");
    if (S.friends[fid]) return fail(`You're already reading buddies with ${name || 'them'}.`);
    const now = Date.now();
    const batch = F.writeBatch(FB.db);
    batch.set(F.doc(FB.db, 'users', fid, 'friends', S.uid), { uid: S.uid, code, since: now, name: S.profile.name || '' });
    batch.set(F.doc(FB.db, 'users', S.uid, 'friends', fid), { uid: fid, since: now, name: String(name).slice(0, 40) });
    await batch.commit();
    closeSheet('added');
    switchTab('friends');
    confetti(140);
    Sound.play('cheer');
    toast(`🎉 You and ${name || 'your friend'} are now reading buddies!`, { type: 'celebrate', ic: 'users', ms: 5000 });
  } catch (e) {
    console.warn('[InkLit] add friend', e);
    fail(e?.code === 'permission-denied' ? "That code didn't work. Ask your friend to open InkLit once so their code is active."
      : navigator.onLine === false ? "You're offline. Try again when you're connected." : "Couldn't add that friend right now. Please try again.");
  }
}

function boardEntries() {
  const myStreak = streakInfo(), myBook = readingBooks()[0];
  const me = {
    uid: S.uid, me: true, name: S.profile.name || 'You', photo: S.profile.photo, xp: S.profile.xp,
    streak: myStreak.streak, readToday: myStreak.today, mastered: vocabCounts().mastered,
    reading: myBook ? { title: myBook.title, pct: bookPct(myBook) } : null
  };
  const others = Object.keys(S.friends).map(fid => {
    const p = S.friendProfiles[fid];
    const base = { uid: fid, name: p?.name || S.friends[fid].name || 'Reader', photo: p?.photo || '', xp: 0, streak: 0, readToday: false };
    if (!p) return { ...base, loading: true };
    if (p.blocked || p.missing) return { ...base, blocked: true };
    const st = friendStatus(p);
    return { ...base, xp: Number(p.xp) || 0, streak: st.streak, readToday: st.readToday, mastered: Number(p.wordsMastered) || 0, reading: p.reading || null };
  });
  return [me, ...others].sort((a, b) => b.streak - a.streak || b.xp - a.xp);
}

});

/* =====================================================================
   33. CAMERA COVER SNAP
   Live camera with a cover-shaped frame. If the browser can't use the camera directly,
   the phone's own camera app opens instead. Every cover is compressed before it's saved.
   ===================================================================== */
const COVER_MAX_CHARS = 90000; // about 65 KB of JPEG per cover
const cam = { stream: null, shot: null };

function compressCover(source) {
  const c = drawScaled(source, 320, 480);
  let q = 0.8;
  let url = c.toDataURL('image/jpeg', q);
  while (url.length > COVER_MAX_CHARS && q > 0.45) {
    q -= 0.1;
    url = c.toDataURL('image/jpeg', q);
  }
  return { url, color: dominantColor(c) };
}

function setDraftCover({ url, color }) {
  if (!bookDraft || !url) return;
  Object.assign(bookDraft, { cover: url, color: color || bookDraft.color, coverChanged: true });
  const slot = $('#coverSlot');
  if (slot) {
    slot.querySelector('img')?.remove();
    slot.insertAdjacentHTML('afterbegin', `<img src="${url}" alt="">`);
    slot.classList.add('has');
    slot.classList.remove('flash');
    void slot.offsetWidth;
    slot.classList.add('flash');
  }
  Sound.play('good');
  haptic(8);
}

const liveCameraOK = () => !!navigator.mediaDevices?.getUserMedia && window.isSecureContext;

function camBarHTML(captured) {
  return captured
    ? `<button type="button" class="btn btn-ghost btn-lg" data-act="cam-retake">${icon('refresh')} Retake</button>
       <button type="button" class="btn btn-primary btn-lg" data-act="cam-use">${icon('check')} Use photo</button>`
    : `<button type="button" class="cam-shutter" id="camShutter" data-act="cam-snap" aria-label="Take photo"${cam.stream ? '' : ' disabled'}></button>`;
}

function openCoverCamera() {
  if (!bookDraft || $('#camera-root')) return;
  if (!liveCameraOK()) { $('#coverCam')?.click(); return; } // same tap, so the phone's camera app can open
  document.body.insertAdjacentHTML('beforeend', `
    <div class="cam" id="camera-root" role="dialog" aria-modal="true" aria-label="Snap the book cover">
      <video id="camVideo" playsinline muted autoplay></video>
      <img class="cam-shot hidden" id="camShot" alt="Captured cover">
      <div class="cam-guide" id="camGuide"></div>
      <div class="cam-top"><button type="button" class="icon-btn" data-act="cam-close" aria-label="Close camera">${icon('x')}</button></div>
      <div class="cam-bar" id="camBar">${camBarHTML(false)}</div>
    </div>`);
  pushLayer('camera', () => closeCoverCamera(true));
  startCameraStream();
}

async function startCameraStream() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    const video = $('#camVideo');
    if (!video) { stream.getTracks().forEach(t => t.stop()); return; } // closed while the permission prompt was up
    cam.stream = stream;
    video.srcObject = stream;
    await video.play().catch(() => {});
    const shutter = $('#camShutter');
    if (shutter) shutter.disabled = false;
  } catch (e) {
    cameraFallback(e?.name === 'NotAllowedError' ? "InkLit isn't allowed to use the camera." : "The camera couldn't start.");
  }
}

function cameraFallback(msg) {
  const root = $('#camera-root');
  if (!root) return;
  root.insertAdjacentHTML('beforeend', `<div class="cam-msg">${icon('camera')}<b>${esc(msg)}</b>
    <p class="small">You can still take the photo with your phone's camera app.</p>
    <button type="button" class="btn btn-primary" data-act="cam-native">${icon('camera')} Use the camera app</button>
    <button type="button" class="link" data-act="cam-close">Cancel</button></div>`);
}

function snapCover() {
  const video = $('#camVideo'), guide = $('#camGuide'), root = $('#camera-root');
  if (!video?.videoWidth || !guide || !root) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const vr = video.getBoundingClientRect(), gr = guide.getBoundingClientRect();
  // The preview fills the screen (object-fit: cover), so map the on-screen frame back to camera pixels
  const scale = Math.max(vr.width / vw, vr.height / vh);
  const offX = (vr.width - vw * scale) / 2, offY = (vr.height - vh * scale) / 2;
  const sx = clamp((gr.left - vr.left - offX) / scale, 0, vw - 1);
  const sy = clamp((gr.top - vr.top - offY) / scale, 0, vh - 1);
  const sw = Math.max(1, Math.min(gr.width / scale, vw - sx));
  const sh = Math.max(1, Math.min(gr.height / scale, vh - sy));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw));
  c.height = Math.max(1, Math.round(sh));
  c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  cam.shot = compressCover(c);
  video.pause();
  const shot = $('#camShot');
  shot.src = cam.shot.url;
  shot.classList.remove('hidden');
  guide.classList.add('hidden');
  $('#camBar').innerHTML = camBarHTML(true);
  if (!reduceMotion()) {
    root.insertAdjacentHTML('beforeend', '<div class="cam-flash"></div>');
    setTimeout(() => $('.cam-flash', root)?.remove(), 400);
  }
  Sound.play('flip');
  haptic([10, 30, 10]);
}

function retakeCover() {
  cam.shot = null;
  $('#camShot')?.classList.add('hidden');
  $('#camGuide')?.classList.remove('hidden');
  $('#camBar').innerHTML = camBarHTML(false);
  $('#camVideo')?.play().catch(() => {});
}

function closeCoverCamera(fromHistory = false) {
  cam.stream?.getTracks().forEach(t => t.stop());
  cam.stream = null;
  cam.shot = null;
  const root = $('#camera-root');
  if (!root) return;
  root.remove();
  if (!fromHistory) dropLayer('camera');
}

onAction({

/* =====================================================================
   34. BACKGROUND TIMER NOTIFICATION
   While a session runs and InkLit is minimized or closed, the service worker shows a
   silent notification with the live time. Tapping it reopens the timer.
   ===================================================================== */
let timerNoteOn = true; // starts true so the first check clears any leftover notification
let timerNotePing = 0;

function postToSW(msg) {
  if (!('serviceWorker' in navigator)) return;
  const ctl = navigator.serviceWorker.controller;
  if (ctl) { ctl.postMessage(msg); return; }
  navigator.serviceWorker.ready.then(reg => reg.active?.postMessage(msg)).catch(() => {});
}

const timerAlertsAllowed = () => prefs.notify && 'Notification' in window && Notification.permission === 'granted';

function syncTimerNote() {
  if (document.hidden && timer.running && timerAlertsAllowed()) {
    const book = S.books[timer.bookId];
    const base = timer.startedAt - timer.accMs; // start time as if there had been no pauses
    postToSW({
      type: 'TIMER_SHOW', base, mode: timer.mode, targetMs: tTarget(),
      book: book ? shortTitle(book.title) : '',
      endsAt: timer.mode === 'countdown' ? new Date(base + tTarget()).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''
    });
    timerNoteOn = true;
    if (!timerNotePing) timerNotePing = setInterval(syncTimerNote, 30000); // re-arms the worker while the page is alive
    return;
  }
  clearInterval(timerNotePing);
  timerNotePing = 0;
  if (timerNoteOn) { timerNoteOn = false; postToSW({ type: 'TIMER_HIDE' }); }
}

// The first time someone starts the timer, ask for notification permission (it needs the tap)
function askTimerAlertsOnce() {
  if (prefs.timerAlertsAsked || !('Notification' in window)) return;
  prefs.timerAlertsAsked = true;
  savePrefs();
  if (Notification.permission === 'granted') { prefs.notify = true; savePrefs(); return; }
  if (Notification.permission !== 'default') return;
  askNotifyPermission().then(p => {
    if (p !== 'granted') return;
    prefs.notify = true;
    savePrefs();
    toast('Timer alerts are on. If you leave InkLit, a notification keeps your time.', { type: 'success', ic: 'bell' });
  });
}

document.addEventListener('visibilitychange', syncTimerNote);
addEventListener('pagehide', syncTimerNote);
navigator.serviceWorker?.addEventListener('message', e => {
  if (e.data?.type === 'OPEN_TIMER' && !isSheetOpen()) openTimerSheet();
});
