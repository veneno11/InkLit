<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>InkLit — Reading & Vocab</title>
<meta name="description" content="Track your reading, keep your streak and learn seven new words at a time with spaced repetition." />
<meta name="theme-color" content="#141414" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="InkLit" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" id="favicon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   TOKENS — Dark LifeOS canvas + electric blue + playful functional accents
   ===================================================================== */
:root{
  --bg:#141414;--slab:#1E1E1E;--card:#222222;--raised:#2A2A2A;--line:#333333;--line2:#444444;
  --text:#E3E3E3;--muted:#9B9B9B;--dim:#6B6B6B;
  --blue:#3B82F6;--glow:#60A5FA;--slate:#1E293B;--blue-d:#1D4ED8;
  --green:#10B981;--green-d:#047857;--amber:#F59E0B;--amber-d:#B45309;
  --coral:#FB7185;--coral-d:#BE123C;--purple:#8B5CF6;--purple-l:#C4B5FD;--purple-d:#6D28D9;
  --cyan:#22D3EE;--cyan-d:#0E7490;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);
  font:500 15px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:contain;
  padding-bottom:calc(112px + var(--sb))}
@media(min-width:768px){body{padding-bottom:56px}}
body.locked{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.hidden{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.mt{margin-top:14px}
.mt-sm{margin-top:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#333;border-radius:6px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.solid{fill:currentColor}

/* =====================================================================
   APP BAR + DESKTOP TABS
   ===================================================================== */
.appbar{position:sticky;top:0;z-index:30;padding:calc(10px + var(--st)) 0 10px;
  background:rgba(20,20,20,.86);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid transparent;transition:border-color .3s}
.appbar.scrolled{border-bottom-color:var(--line)}
.appbar-in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:var(--slate);border:1px solid rgba(96,165,250,.35);box-shadow:0 3px 0 #0B1220}
.brand-inky{width:32px;display:block}
.brand-inky svg{width:100%;height:auto;display:block}
.brand-name{font-weight:900;font-size:20px;letter-spacing:-.03em}
.sync-dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--dim);border:2px solid var(--bg);transition:background-color .4s,box-shadow .4s}
.sync-dot.synced{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.6)}
.sync-dot.syncing{background:var(--amber)}
.sync-dot.offline{background:var(--cyan)}
.sync-dot.error{background:var(--coral)}
.desk-tabs{display:none;gap:4px;padding:4px;border-radius:14px;background:var(--slab);border:1px solid var(--line);margin-left:8px}
@media(min-width:768px){.desk-tabs{display:flex}}
.dtab{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted);transition:color .2s,background-color .25s,box-shadow .25s}
.dtab .ic{width:18px;height:18px}
.dtab:hover{color:var(--text)}
.dtab.on{color:#fff;background:var(--slate);box-shadow:inset 0 0 0 1px rgba(96,165,250,.4)}
.dtab.on .ic{color:var(--glow)}
.pills{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-weight:800;font-size:14px;color:var(--muted);transition:color .3s,background-color .3s,border-color .3s}
.pill .ic{width:17px;height:17px}
.pill.lit{color:var(--amber);background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4)}
.pill.lit .ic{fill:currentColor}
.pill.xp{color:var(--glow)}
.bump{animation:bump .55s var(--spring)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--blue);color:#fff;font-weight:900;
  box-shadow:0 3px 0 var(--blue-d);transition:transform .2s var(--spring)}
.avatar:active{transform:scale(.92)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:56px;height:56px;font-size:22px}
@media(max-width:380px){.pill.xp{display:none}.brand-name{font-size:18px}}

/* =====================================================================
   LAYOUT + HEADINGS + SURFACES
   ===================================================================== */
.wrap{max-width:760px;margin:0 auto;padding:6px 16px 0}
.tab{padding-top:10px}
.tab.enter>*{animation:rise .55s var(--ease) both}
.tab.enter>*:nth-child(2){animation-delay:.05s}
.tab.enter>*:nth-child(3){animation-delay:.1s}
.tab.enter>*:nth-child(4){animation-delay:.15s}
.tab.enter>*:nth-child(5){animation-delay:.2s}
.tab.enter>*:nth-child(n+6){animation-delay:.25s}
.page-title{font-size:28px;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.page-sub{color:var(--muted);font-size:14px;margin-top:6px;max-width:54ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--glow)}
.section{margin-top:30px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head.tight{margin-bottom:4px}
.sec-title{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.sec-title .ic{color:var(--glow)}
.sec-title.sm{font-size:16px}
.sec-sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 0 #0F0F0F}
.hint{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);margin-top:10px}
.hint .ic{width:15px;height:15px}

/* =====================================================================
   BUTTONS — chunky 3D Duolingo-style presses
   ===================================================================== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:15px;
  font-weight:800;font-size:15px;white-space:nowrap;
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),background-color .2s,filter .2s,opacity .2s}
.btn .ic{width:19px;height:19px}
.btn:active{transform:translateY(3px)}
.btn:disabled{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn-primary:hover{background:#4F8FF7}
.btn-primary:active{box-shadow:0 1px 0 var(--blue-d)}
.btn-green{background:var(--green);color:#03140D;box-shadow:0 4px 0 var(--green-d)}
.btn-green:hover{background:#19C48C}
.btn-green:active{box-shadow:0 1px 0 var(--green-d)}
.btn-green-outline{background:rgba(16,185,129,.1);color:#34D399;border:1.5px solid rgba(16,185,129,.45);box-shadow:0 4px 0 rgba(4,120,87,.55)}
.btn-green-outline:active{box-shadow:0 1px 0 rgba(4,120,87,.55)}
.btn-ghost{background:var(--raised);color:var(--text);border:1px solid var(--line);box-shadow:0 4px 0 #101010}
.btn-ghost:hover{border-color:var(--line2)}
.btn-ghost:active{box-shadow:0 1px 0 #101010}
.btn-danger{background:rgba(244,63,94,.1);color:var(--coral);border:1.5px solid rgba(244,63,94,.35);box-shadow:0 4px 0 rgba(190,18,60,.45)}
.btn-danger:active{box-shadow:0 1px 0 rgba(190,18,60,.45)}
.btn-sm{height:38px;padding:0 13px;font-size:14px;border-radius:12px}
.btn-sm .ic{width:17px;height:17px}
.btn-lg{height:58px;font-size:17px;border-radius:18px}
.btn-block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:12px;flex:none;display:inline-grid;place-items:center;color:var(--muted);
  transition:color .2s,background-color .2s,transform .15s var(--ease)}
.icon-btn:hover{color:var(--text);background:var(--raised)}
.icon-btn:active{transform:scale(.9)}
.icon-btn:disabled{opacity:.35;pointer-events:none}
.icon-btn.lg{width:58px;height:58px;border-radius:18px;background:var(--raised);border:1px solid var(--line);box-shadow:0 4px 0 #101010;color:var(--text)}
.icon-btn.lg .ic{width:24px;height:24px}
.icon-btn.lg.save{color:#34D399}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--glow);font-weight:700;font-size:14px;padding:8px 6px;border-radius:8px}
.link .ic{width:16px;height:16px}
.link:hover{text-decoration:underline}
.link.danger{color:var(--coral)}
.center-block{display:flex;margin:10px auto 0;justify-content:center}

/* =====================================================================
   TAGS, CHIPS, SEGMENTED CONTROLS
   ===================================================================== */
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;background:var(--raised);color:var(--muted);vertical-align:middle}
.tag .ic{width:13px;height:13px}
.tag.blue{background:rgba(59,130,246,.16);color:var(--glow)}
.tag.green{background:rgba(16,185,129,.14);color:#34D399}
.tag.amber{background:rgba(245,158,11,.14);color:#FBBF24}
.tag.coral{background:rgba(251,113,133,.14);color:var(--coral)}
.tag.purple{background:rgba(139,92,246,.18);color:var(--purple-l)}
.tag.cyan{background:rgba(34,211,238,.13);color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.center{justify-content:center}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);
  font-weight:700;font-size:14px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background-color .25s var(--ease),color .2s,border-color .2s,transform .15s var(--spring)}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.chip:disabled{opacity:.4;pointer-events:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:15px;background:var(--bg);border:1px solid var(--line)}
.seg button{flex:1;height:40px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .25s var(--ease)}
.seg button .ic{width:17px;height:17px}
.seg button.on{background:var(--slate);color:var(--glow);box-shadow:inset 0 0 0 1px rgba(96,165,250,.45)}
.seg button:disabled:not(.on){opacity:.4}

/* =====================================================================
   FORMS
   ===================================================================== */
.label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.field{width:100%;height:50px;padding:0 14px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);color:var(--text);font-size:16px;font-weight:600;
  transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:var(--dim);font-weight:500}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.18)}
.field.center{text-align:center}
textarea.field{height:auto;min-height:104px;padding:12px 14px;line-height:1.5;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-status{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px;min-height:18px}
.form-status.bad{color:var(--coral)}
.form-status.good{color:#34D399}
.range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
.range::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--blue) var(--fill,0%),var(--line2) var(--fill,0%))}
.range::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--blue) var(--fill,0%),var(--line2) var(--fill,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#fff;border:4px solid var(--blue);box-shadow:0 2px 0 var(--blue-d)}
.range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--blue)}
.range:disabled{opacity:.4}
.progress-edit{display:flex;align-items:center;gap:12px;margin-top:10px}
.progress-edit span{font-weight:900;font-size:18px;min-width:52px;text-align:right;color:var(--glow)}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.stepper .icon-btn{width:48px;height:50px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);cursor:pointer;margin-top:10px;font-weight:700}
.switch-row small{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin-top:2px}
.switch{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:48px;height:28px;border-radius:999px;background:var(--line2);cursor:pointer;transition:background-color .25s;margin:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.set-block{padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);margin-top:12px}
.set-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:15px}
.set-title .ic{width:17px;height:17px;color:var(--glow)}
.key-row{display:flex;gap:8px;margin-top:10px}
.key-row .field{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px}
.profile-row{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.pname{font-weight:900;font-size:19px;letter-spacing:-.02em}
.version{text-align:center;font-size:12px;color:var(--dim);margin-top:14px}

/* =====================================================================
   PROGRESS RINGS
   ===================================================================== */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none}
.ring-track{stroke:var(--raised)}
.ring-bar{stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.tab.enter .ring-bar,.lesson .ring-bar,.finish-hero~* .ring-bar{animation:ringIn 1.1s var(--ease) both}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.ring-in b{font-size:22px;font-weight:900;letter-spacing:-.03em}
.ring-in small{font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}

/* =====================================================================
   HOME — greeting, streak hero, quick actions
   ===================================================================== */
.greet-date{font-size:13px;font-weight:700;color:var(--muted)}
.hero{margin-top:16px;padding:18px;background:linear-gradient(150deg,#1A2333 0%,var(--card) 58%);border-color:#2B3546}
.hero-top{display:flex;align-items:center;gap:16px}
.hero-text{min-width:0;flex:1}
.streak-line{display:flex;align-items:center;gap:12px}
.flame-badge{width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;color:var(--dim);background:var(--raised);border:1.5px solid var(--line);
  transition:color .3s,background-color .3s,border-color .3s}
.flame-badge .ic{width:26px;height:26px}
.flame-badge.warn{color:var(--amber);border-color:rgba(245,158,11,.4)}
.flame-badge.lit{color:#FB923C;background:rgba(251,146,60,.14);border-color:rgba(251,146,60,.5)}
.flame-badge.lit .ic{fill:currentColor;animation:flicker 2.6s ease-in-out infinite;transform-origin:50% 90%}
.flame-badge.just-lit{animation:flameBurst .8s var(--spring)}
.streak-num{font-size:24px;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.streak-sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.streak-sub.warn{color:#FBBF24}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:18px 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--dim)}
.wd i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--bg);color:#1A1205;transition:all .3s}
.wd i .ic{width:16px;height:16px;stroke-width:3}
.wd.done i{background:var(--amber);border-color:var(--amber);box-shadow:0 3px 0 var(--amber-d)}
.wd.today{color:var(--text)}
.wd.today:not(.done) i{border-color:var(--glow);box-shadow:0 0 0 3px rgba(96,165,250,.15)}
.read-btn .ic{stroke-width:3}
.read-btn:not(:disabled){animation:breathe 2.8s ease-in-out infinite}
.logged{display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;padding:0 10px 0 16px;border-radius:18px;
  background:rgba(16,185,129,.1);border:1.5px solid rgba(16,185,129,.4);color:#34D399;font-weight:800}
.logged>span{display:inline-flex;align-items:center;gap:9px}
.logged.pop{animation:popBig .6s var(--spring)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.qa{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 0 #0F0F0F;
  transition:transform .15s var(--ease),border-color .2s,box-shadow .15s}
.qa:hover{border-color:var(--line2)}
.qa:active{transform:translateY(3px);box-shadow:0 1px 0 #0F0F0F}
.qa b{display:block;font-weight:800;font-size:15px}
.qa small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.qa-ic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center}
.qa-ic .ic{width:22px;height:22px}
.qa.cyan .qa-ic{background:rgba(34,211,238,.13);color:var(--cyan)}
.qa.purple .qa-ic{background:rgba(139,92,246,.18);color:var(--purple-l)}
@media(max-width:420px){.qa{flex-direction:column;align-items:flex-start;gap:10px}}

/* =====================================================================
   CURRENTLY READING CARDS
   ===================================================================== */
.rlist{display:grid;gap:12px}
@media(min-width:700px){.rlist{grid-template-columns:1fr 1fr}}
.rcard{display:flex;gap:14px;padding:14px}
.thumb{width:66px;height:99px;flex:none;border-radius:4px 10px 10px 4px;overflow:hidden;display:grid;place-items:center;background:var(--spine,#334155);color:var(--ink,#fff);
  font-weight:900;font-size:18px;box-shadow:0 10px 18px -8px #000,inset 5px 0 0 rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.thumb:active{transform:scale(.95)}
.thumb img{width:100%;height:100%;object-fit:cover}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column}
.rtitle{font-size:16px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:999px;background:var(--raised);overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--glow));transition:width .8s var(--ease)}
.tab.enter .bar>span{animation:grow 1.1s var(--ease) both}
.rstats{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.rstats b{color:var(--glow)}
.rfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.ractions{display:flex;gap:6px}
.ractions .btn-sm{padding:0 11px}

/* =====================================================================
   EMPTY STATES + MASCOT
   ===================================================================== */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 18px;border-radius:22px;border:1.5px dashed var(--line2);color:var(--muted)}
.empty h3{color:var(--text);font-size:17px;font-weight:800}
.empty p{max-width:40ch;font-size:14px}
.empty .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.inky{width:84px;margin:0 auto;animation:bob 3s ease-in-out infinite;transform-origin:50% 90%}
.inky svg{width:100%;height:auto;display:block;overflow:visible}
.inky.sm{width:64px}
.inky.mood-celebrate{animation:jump .8s var(--spring) 2,bob 3s ease-in-out 1.6s infinite}
.inky.mood-think{animation:think 1.4s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.tent{transform-box:fill-box;transform-origin:50% 0;animation:wiggle 2.4s ease-in-out infinite}

/* =====================================================================
   ARCHIVED BOOKSHELF — repurposed LifeOS 3D spines
   ===================================================================== */
.bookcase{--row:200px;--plank:14px;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:3px;padding:0 14px;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:
    repeating-linear-gradient(180deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,.32) calc(var(--row) - var(--plank)),
      #2B3546 calc(var(--row) - var(--plank)),
      #1E293B calc(var(--row) - var(--plank) + 2px),
      #172033 calc(var(--row) - 4px),
      #0B0F18 calc(var(--row) - 4px),
      #0B0F18 var(--row)),
    linear-gradient(90deg,#0F0F10,#1A1A1C 12%,#1A1A1C 88%,#0F0F10);
  box-shadow:inset 0 20px 40px -20px rgba(0,0,0,.6)}
.book-slot{height:var(--row);padding-bottom:var(--plank);display:flex;align-items:flex-end}
.book{position:relative;display:block;flex-shrink:0;width:var(--w);height:var(--h);border-radius:3px 3px 2px 2px;color:var(--ink);transform-origin:50% 100%;
  box-shadow:2px 0 5px -2px rgba(0,0,0,.8),0 2px 2px rgba(0,0,0,.5);
  transition:transform .45s var(--spring),filter .3s,box-shadow .3s}
.book::before{content:'';position:absolute;left:2px;right:2px;top:-3px;height:4px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#F4EBDC,#CFC4AE);opacity:.85;z-index:-1}
.book-face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:var(--spine)}
.book-face::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.16) 20%,rgba(255,255,255,.03) 48%,rgba(0,0,0,.08) 72%,rgba(0,0,0,.48))}
.book-face::before{content:'';position:absolute;left:0;right:0;top:10px;bottom:10px;opacity:.3;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.book-text{position:absolute;inset:18px 0 30px;display:flex;flex-direction:column;align-items:center;gap:8px}
.book-text span{writing-mode:vertical-rl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0}
.bt-title{flex:1 1 auto;font-size:clamp(9px,calc(var(--w) * .34),13.5px);font-weight:800;letter-spacing:.02em}
.bt-author{flex:0 1 auto;max-height:40%;font-size:clamp(8px,calc(var(--w) * .26),10.5px);font-weight:700;opacity:.75}
.bt-rate{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:900;line-height:1;color:#FCD34D}
.bt-rate .ic{width:9px;height:9px;stroke-width:2.5}
@media(any-hover:hover){
  .book:hover{transform:translateY(-12px) rotate(var(--tilt));filter:brightness(1.14);z-index:2;box-shadow:4px 16px 18px -8px rgba(0,0,0,.9),0 2px 2px rgba(0,0,0,.5)}
  .book-slot:has(>.book:hover)+.book-slot>.book{transform:rotate(-2deg)}
}
.book:focus-visible{transform:translateY(-12px) rotate(var(--tilt));z-index:2}
.book:active{transform:translateY(-6px) scale(.97);transition-duration:.12s}
.book.drop{animation:bookDrop .9s var(--spring) both}

/* Archived book modal — 2D front cover */
.arch{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
@media(max-width:420px){.arch{grid-template-columns:1fr}.arch-cover{width:160px;margin:0 auto}}
.arch-cover{aspect-ratio:2/3;width:100%;border-radius:14px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--spine,#334155) 55%,transparent),var(--bg) 75%);border:1px solid var(--line);
  box-shadow:0 18px 30px -16px #000}
.arch-cover img{width:100%;height:100%;object-fit:contain!important}
.gen-cover{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:16px 14px;background:linear-gradient(160deg,var(--spine),#0B0F18);color:var(--ink)}
.gen-cover b{font-size:17px;font-weight:900;line-height:1.15;letter-spacing:-.02em}
.gen-cover small{font-size:12px;font-weight:700;opacity:.8}
.arch-title{font-size:21px;font-weight:900;letter-spacing:-.025em;line-height:1.15}
.arch-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.astat{display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.astat .ic{width:18px;height:18px;color:var(--cyan);margin-top:2px}
.astat small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.astat b{display:block;font-size:14px;font-weight:800;margin-top:1px}

/* Stars */
.stars{display:flex;gap:6px;justify-content:center}
.star{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:var(--line2);transition:color .2s,transform .35s var(--spring)}
.star .ic{width:36px;height:36px;stroke-width:1.8}
.star.on{color:var(--amber)}
.star.on .ic{fill:currentColor}
.star.pop{animation:starPop .5s var(--spring) both}
.star:active{transform:scale(.82)}
.stars.sm{justify-content:flex-start;gap:2px;margin-top:8px}
.stars.sm .star{width:34px;height:34px;border-radius:10px}
.stars.sm .star .ic{width:24px;height:24px}
.rate-q{text-align:center;font-weight:800;font-size:16px;margin:18px 0 8px}
.rate-label{text-align:center;color:var(--muted);font-weight:700;font-size:14px;min-height:20px;margin:6px 0 16px}

/* Finish sheet */
.finish-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.finish-hero .sheet-title{margin-top:4px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.mini-stats>div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-align:center}
.mini-stats .ic{color:var(--cyan)}
.mini-stats b{font-size:15px;font-weight:900}
.mini-stats small{font-size:11.5px;color:var(--muted);font-weight:700}

/* Book form */
.book-form{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.cover-slot{position:relative;width:96px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--dim);
  background:var(--bg);border:1.5px dashed var(--line2);transition:border-color .2s,color .2s,transform .15s var(--ease)}
.cover-slot:hover{border-color:var(--glow);color:var(--glow)}
.cover-slot:active{transform:scale(.96)}
.cover-slot.has{border-style:solid;border-color:var(--line)}
.cover-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-slot.has .cover-empty{display:none}
.cover-slot.flash{animation:fieldFlash .9s var(--ease)}
.cover-empty{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700}
.bf-fields .label:first-child{margin-top:0}

/* =====================================================================
   READING TIMER
   ===================================================================== */
.timer-face{display:flex;justify-content:center;margin:20px 0 6px}
.tm-time{font-size:46px;font-weight:900;letter-spacing:-.04em;line-height:1}
.tm-sub{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
.tm-controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px}
.tm-main{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#05232A;box-shadow:0 6px 0 var(--cyan-d);
  transition:transform .12s var(--ease),box-shadow .12s}
.tm-main .ic{width:34px;height:34px}
.tm-main:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cyan-d)}
.tm-main.running{background:var(--raised);color:var(--cyan);box-shadow:0 6px 0 #0E0E0E,inset 0 0 0 2px rgba(34,211,238,.5)}
.tm-hint{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
.tm-ring.running .ring-bar{filter:drop-shadow(0 0 6px rgba(34,211,238,.6))}
.timer-float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + var(--sb));z-index:39;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;
  border-radius:999px;background:rgba(14,40,46,.95);border:1px solid rgba(34,211,238,.45);color:var(--cyan);font-weight:800;font-size:14px;
  box-shadow:0 14px 30px -10px rgba(0,0,0,.8);animation:floatIn .5s var(--spring) both}
.timer-float span{color:var(--text);font-weight:700}
@media(min-width:768px){.timer-float{bottom:24px}}
.tf-dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.tf-dot.on{background:var(--cyan);animation:pulseDot 1.4s ease-in-out infinite}
.session-hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3)}
.ses-icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(34,211,238,.15);color:var(--cyan)}
.ses-icon .ic{width:26px;height:26px}
.ses-time{font-size:26px;font-weight:900;letter-spacing:-.03em;color:var(--cyan)}

/* =====================================================================
   SHEETS — dialog on desktop, bottom sheet on phones
   ===================================================================== */
#sheet-root{position:fixed;inset:0;z-index:60;display:none}
#sheet-root.open{display:flex;align-items:center;justify-content:center;padding:16px}
.backdrop{position:absolute;inset:0;background:rgba(6,7,8,.68);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .25s ease both}
.sheet{position:relative;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;padding:20px;border-radius:26px;
  background:var(--slab);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.85);animation:dialogIn .42s var(--spring) both}
.sheet.wide{max-width:560px}
#sheet-root.closing .backdrop{animation:fadeOut .22s ease forwards}
#sheet-root.closing .sheet{animation:dialogOut .22s ease forwards}
.grab{display:none;width:42px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-title{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900;letter-spacing:-.025em;line-height:1.2}
.sheet-title .ic{color:var(--cyan)}
.sheet-title.center{justify-content:center;text-align:center}
.sheet-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:22px}
.sheet-actions.single{grid-template-columns:1fr;margin-top:12px}
.sheet.dragging{animation:none!important;transition:none!important}
@media(max-width:767px){
  #sheet-root.open{align-items:flex-end;padding:0}
  .sheet{max-width:none;max-height:92vh;border-radius:28px 28px 0 0;border-bottom:0;padding:10px 18px calc(20px + var(--sb));animation:sheetUp .45s var(--ease) both}
  .sheet.wide{max-width:none}
  #sheet-root.closing .sheet{animation:sheetDown .24s ease-in forwards}
  .grab{display:block}
}

/* =====================================================================
   VOCAB LESSON — full-screen micro-lesson player
   ===================================================================== */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--st);animation:lessonIn .45s var(--ease) both}
.lesson-inner{max-width:620px;margin:0 auto;width:100%}
.lesson-top{display:flex;align-items:center;gap:12px;max-width:652px;width:100%;margin:0 auto;padding:10px 16px}
.phases{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.phase-seg{height:12px;border-radius:999px;background:var(--raised);overflow:hidden}
.phase-seg i{display:block;height:100%;border-radius:inherit;background:var(--glow);transition:width .5s var(--ease)}
.phase-seg.done i{background:var(--green)}
.phase-seg.cur{box-shadow:0 0 0 2px rgba(96,165,250,.25)}
.lesson-xp{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--glow);min-width:48px;justify-content:flex-end}
.lesson-xp .ic{width:18px;height:18px}
.lesson-body{flex:1;overflow-y:auto;padding:6px 16px 20px}
.lesson-foot{padding:12px 16px calc(14px + var(--sb));border-top:1px solid var(--line);background:var(--bg)}
.lesson-loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:800;color:var(--muted);padding:24px;text-align:center}
.dots-load{display:flex;gap:6px}
.dots-load i{width:10px;height:10px;border-radius:50%;background:var(--glow);animation:dotBounce 1s ease-in-out infinite}
.dots-load i:nth-child(2){animation-delay:.15s}
.dots-load i:nth-child(3){animation-delay:.3s}
.phase-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--glow);margin-top:8px}
.prompt-title{font-size:23px;font-weight:900;letter-spacing:-.025em;line-height:1.25;margin:6px 0 16px}
.flip{perspective:1200px;height:min(52vh,360px);min-height:280px;cursor:pointer;animation:cardIn .5s var(--spring) both}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s var(--spring)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:auto}
.face.front{background:linear-gradient(160deg,#3B82F6,#1D4ED8);color:#fff;box-shadow:0 8px 0 #1E3A8A}
.face.front.purple{background:linear-gradient(160deg,#8B5CF6,#6D28D9);box-shadow:0 8px 0 #4C1D95}
.face.front .tag{background:rgba(255,255,255,.2);color:#fff}
.face.back{background:var(--card);border:1.5px solid var(--line);transform:rotateY(180deg);box-shadow:0 8px 0 #0B0B0B}
.flip:not(.flipped) .back,.flip.flipped .front{pointer-events:none}
.big-word{font-size:clamp(34px,9vw,50px);font-weight:900;letter-spacing:-.035em;margin:12px 0 2px;word-break:break-word}
.face-sub{font-weight:700;opacity:.85}
.tap-hint{position:absolute;bottom:16px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;opacity:.85}
.tap-hint .ic{width:15px;height:15px}
.back-word{font-size:30px;font-weight:900;letter-spacing:-.03em;color:#fff}
.pron{font-weight:700;color:var(--glow);margin-bottom:6px}
.def{font-size:19px;font-weight:800;line-height:1.35;margin:10px 0 6px}
.def.light{color:#fff;font-size:21px}
.clue{font-style:italic;opacity:.92;line-height:1.5;margin-top:4px;max-width:44ch}
.ex{color:var(--muted);font-style:italic;line-height:1.55;max-width:46ch}
.hl{background:rgba(139,92,246,.2);color:var(--purple-l);padding:1px 6px;border-radius:7px;font-weight:800;font-style:normal;box-shadow:inset 0 -2px 0 rgba(139,92,246,.6)}
mark.hl[data-act]{cursor:pointer}
mark.hl[data-act]:hover{background:rgba(139,92,246,.32)}
.lesson-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.counter{text-align:center;font-size:13px;font-weight:700;color:var(--dim);margin-top:12px}
.heard{text-align:center;font-weight:700;color:var(--muted);min-height:20px;margin-top:10px;font-size:14px}
.heard.good{color:#34D399}
.mic-btn.listening,.mic-big.listening{color:#fff;background:var(--coral);border-color:var(--coral);animation:micPulse 1.2s infinite}
.foot-q{text-align:center;font-weight:800;color:var(--muted);font-size:14px;margin-bottom:10px}
.foot-hint{text-align:center;font-weight:700;color:var(--dim);font-size:14px;padding:14px 0}
.grade-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn-grade{height:56px;font-size:14.5px;white-space:normal;line-height:1.15;padding:0 8px}
.btn-grade.g1{background:rgba(244,63,94,.12);color:var(--coral);border:1.5px solid rgba(244,63,94,.45);box-shadow:0 4px 0 rgba(190,18,60,.55)}
.btn-grade.g3{background:rgba(245,158,11,.12);color:#FBBF24;border:1.5px solid rgba(245,158,11,.45);box-shadow:0 4px 0 rgba(180,83,9,.6)}
.btn-grade.g5{background:var(--green);color:#03140D;box-shadow:0 4px 0 var(--green-d)}
.btn-grade:active{box-shadow:none}
.story-card{padding:20px}
.story-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.story-head h3{font-size:19px;font-weight:900;letter-spacing:-.02em}
.story{font-size:17px;line-height:1.8;color:#EDEDED}
.word-tip{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);font-size:14px;color:var(--muted);min-height:46px}
.word-tip b{color:var(--purple-l)}
.skel{height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,var(--raised),#353535,var(--raised));background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel.w60{width:60%;height:20px}
.skel.w80{width:80%}
.drill-card{padding:22px 18px;margin-bottom:16px}
.blank-sentence{font-size:20px;font-weight:700;line-height:1.6}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--glow);text-align:center;padding:0 4px;color:var(--glow)}
.blank.filled.ok{color:#34D399;border-color:var(--green);animation:popBig .5s var(--spring)}
.blank.filled.no{color:var(--coral);border-color:var(--coral)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-list{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:17px;background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 0 #0E0E0E;font-weight:700;line-height:1.45;transition:transform .12s var(--ease),border-color .2s,background-color .2s,box-shadow .12s}
.opt:hover{border-color:var(--line2)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #0E0E0E}
.word-opt{justify-content:center;text-align:center;font-size:16px;font-weight:800}
.opt-letter{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--raised);font-size:13px;font-weight:900;color:var(--muted)}
.opt.correct{border-color:var(--green);background:rgba(16,185,129,.12);color:#6EE7B7;box-shadow:0 4px 0 var(--green-d);animation:popBig .45s var(--spring)}
.opt.correct .opt-letter{background:var(--green);color:#03140D}
.opt.wrong{border-color:var(--coral);background:rgba(244,63,94,.1);color:#FDA4AF;animation:shake .45s}
.opt.wrong .opt-letter{background:var(--coral);color:#2A0710}
.opt.dim{opacity:.45}
.opt.locked{pointer-events:none}
.feedback{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px;border-radius:16px;font-size:14px;animation:popBig .4s var(--spring)}
.feedback .ic{width:22px;height:22px;margin-top:1px}
.feedback b{display:block;font-size:15px;margin-bottom:3px}
.feedback p{color:var(--text);line-height:1.5}
.feedback.good{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:#34D399}
.feedback.bad{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.32);color:var(--coral)}
.def-hint{font-size:14px;margin:-6px 0 14px}
.mic-big{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;margin:14px 0 10px;border-radius:20px;background:var(--raised);
  border:1.5px solid var(--line);box-shadow:0 4px 0 #0E0E0E;font-weight:800;color:var(--text)}
.mic-big .ic{width:34px;height:34px;color:var(--coral)}
.mic-big.listening .ic{color:#fff}
.prod-text{margin-top:12px}
.foot-split{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.summary-hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:6px}
.summary-title{font-size:26px;font-weight:900;letter-spacing:-.035em}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 16px}
.sstat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 6px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 0 #0F0F0F;text-align:center}
.sstat>span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sbig{display:flex;align-items:center;gap:5px;font-size:24px;font-weight:900;letter-spacing:-.03em;height:84px}
.sbig .ic{width:24px;height:24px}
.sbig.blue{color:var(--glow)}
.sbig.green{color:#34D399}
.res-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.res-row:last-child{border-bottom:0}
.res-row>div:first-child{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.res-row b{font-weight:800;margin-right:2px}
.res-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.g-chip{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--raised);color:var(--muted)}
.g-chip.g1{background:rgba(244,63,94,.12);color:var(--coral)}
.g-chip.g3{background:rgba(245,158,11,.12);color:#FBBF24}
.g-chip.g5{background:rgba(16,185,129,.12);color:#34D399}
.due{font-size:12.5px;font-weight:700;color:var(--cyan)}

/* =====================================================================
   LEARN DASHBOARD
   ===================================================================== */
.learn-hero{margin-top:16px;padding:18px;background:linear-gradient(150deg,#221A38 0%,var(--card) 60%);border-color:#33294D}
.lh-top{display:flex;align-items:center;gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
@media(max-width:420px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.stat b{font-size:22px;font-weight:900;letter-spacing:-.03em}
.stat small{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat.cyan b{color:var(--cyan)}
.stat.amber b{color:#FBBF24}
.stat.green b{color:#34D399}
.stat.purple b{color:var(--purple-l)}
.next-drill{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
.next-drill .ic{width:15px;height:15px;color:var(--purple-l)}
.q-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.q-row:last-child{border-bottom:0}
.q-main{flex:1;min-width:0}
.q-word{font-weight:800;font-size:15px}
.q-def{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.lesson-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.lesson-row:last-child{border-bottom:0}
.lesson-row small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}

/* =====================================================================
   FRIENDS & STREAKS
   ===================================================================== */
.invite{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px;background:linear-gradient(150deg,#1A2333,var(--card) 60%);border-color:#2B3546}
.invite-code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:28px;font-weight:900;letter-spacing:.2em;color:var(--glow);margin:4px 0 2px}
.invite-actions{display:flex;gap:8px;flex-wrap:wrap}
.flist{display:grid;gap:10px}
.friend{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.friend.me{border-color:rgba(96,165,250,.4);background:linear-gradient(150deg,#1A2333,var(--card) 70%)}
.rank{width:22px;text-align:center;font-weight:900;color:var(--dim);flex:none}
.fav{position:relative;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--slate);color:var(--glow);font-weight:900;font-size:18px}
.fav img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.fav.read::after{content:'';position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2.5px solid var(--card)}
.fbody{flex:1;min-width:0}
.fname{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px}
.fstreak{display:inline-flex;align-items:center;gap:3px;color:var(--dim)}
.fstreak .ic{width:15px;height:15px}
.fstreak.lit{color:#FB923C}
.fstreak.lit .ic{fill:currentColor}
.fnow{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnow .ic{width:14px;height:14px;flex:none}
.cheer-btn{height:40px;padding:0 13px;border-radius:13px;font-size:14px;background:rgba(245,158,11,.12);color:#FBBF24;border:1.5px solid rgba(245,158,11,.45);box-shadow:0 4px 0 rgba(180,83,9,.55)}
.cheer-btn:active{box-shadow:0 1px 0 rgba(180,83,9,.55)}
.cheer-btn.sent{background:var(--raised);color:var(--muted);border-color:var(--line);box-shadow:0 4px 0 #101010}
.cheer-btn.pop .ic{animation:highFive .7s var(--spring)}
.spark{position:fixed;z-index:90;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:spark .75s var(--ease) forwards}

/* =====================================================================
   TOASTS
   ===================================================================== */
#toasts{position:fixed;z-index:80;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);width:min(92vw,400px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
@media(min-width:768px){#toasts{left:auto;right:18px;top:80px;transform:none}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px;border-radius:16px;background:rgba(34,34,34,.97);border:1px solid var(--line2);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.85);font-size:14.5px;font-weight:600;animation:toastIn .5s var(--spring) both}
.toast>.ic{color:var(--glow)}
.toast.success>.ic{color:var(--green)}
.toast.error>.ic{color:var(--coral)}
.toast.celebrate{background:linear-gradient(135deg,#1E2B45,#232323);border-color:rgba(96,165,250,.55);font-weight:800}
.toast.celebrate>.ic{color:var(--amber)}
.toast-msg{flex:1;line-height:1.35}
.toast-action{flex:none;height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:800;color:var(--text);background:var(--raised);border:1px solid var(--line2)}
.toast.leaving{animation:toastOut .25s ease forwards}

/* =====================================================================
   BOTTOM NAV (phones)
   ===================================================================== */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 14px calc(12px + var(--sb))}
@media(min-width:768px){.bottom-nav{display:none}}
.nav-pill{pointer-events:auto;position:relative;display:flex;width:100%;max-width:440px;padding:6px;border-radius:24px;background:rgba(24,24,27,.93);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 44px -14px rgba(0,0,0,.9)}
.nav-ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:18px;background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.38)}
.nav-ind.ready{transition:transform .5s var(--spring),width .4s var(--ease)}
.nav-btn{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;font-size:11px;font-weight:800;color:var(--muted);transition:color .25s}
.nav-btn .ic{width:22px;height:22px;transition:transform .4s var(--spring)}
.nav-btn:active .ic{transform:scale(.85)}
.nav-btn.on{color:var(--glow)}
.nav-btn.on .ic{transform:translateY(-1px) scale(1.08)}
.nav-badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--purple);color:#fff;font-size:10.5px;font-weight:900;
  display:grid;place-items:center;border:2px solid #18181B}
.dtab .nav-badge{position:static;border:0;margin-left:2px}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95;display:none}

/* =====================================================================
   KEYFRAMES
   ===================================================================== */
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes dialogIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes dialogOut{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes lessonIn{from{opacity:0;transform:translateY(24px)}}
@keyframes cardIn{from{opacity:0;transform:translateX(36px) rotate(3deg)}}
@keyframes popBig{0%{transform:scale(.9)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes grow{from{width:0}}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jump{0%{transform:none}30%{transform:translateY(-22px) scale(1.05,.95) rotate(-6deg)}60%{transform:scale(1.08,.92)}100%{transform:none}}
@keyframes think{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.08) rotate(-3deg)}65%{transform:scale(.96) rotate(2deg)}}
@keyframes flameBurst{0%{transform:scale(.5) rotate(-12deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes starPop{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}
@keyframes bookDrop{0%{opacity:0;transform:translateY(-70px) rotate(-10deg)}60%{opacity:1;transform:translateY(6px) rotate(2deg)}100%{transform:none}}
@keyframes fieldFlash{0%{box-shadow:0 0 0 0 rgba(96,165,250,.6)}100%{box-shadow:0 0 0 12px rgba(96,165,250,0)}}
@keyframes floatIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@keyframes dotBounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(251,113,133,.5)}100%{box-shadow:0 0 0 16px rgba(251,113,133,0)}}
@keyframes highFive{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-25deg) scale(1.35)}60%{transform:rotate(12deg) scale(1.1)}100%{transform:none}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(220deg) scale(.4);opacity:0}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
   /* =====================================================================
   V2.1 — camera cover snap, reading reflection, shelf fix
   ===================================================================== */
/* Shelf: the cream page tops were drawn behind the shelf and only flashed on hover */
.book{isolation:isolate}

/* Book sheet: cover buttons */
.cover-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cover-actions .btn{white-space:normal;line-height:1.15;height:auto;min-height:42px;padding:6px 10px}

/* Live camera */
.cam{position:fixed;inset:0;z-index:70;background:#000;color:#fff;overflow:hidden;animation:fadeIn .25s ease both}
.cam video,.cam-shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-shot{object-fit:contain;background:#000}
.cam-guide{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(72vw,calc(62vh * 2 / 3));aspect-ratio:2/3;
  border:2px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none}

.cam-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:flex-end;padding:calc(10px + var(--st)) 12px 0}

.cam-flash{position:absolute;inset:0;z-index:4;background:#fff;pointer-events:none;animation:camFlash .35s ease-out forwards}
@keyframes camFlash{from{opacity:.9}to{opacity:0}}

/* Reading reflection */
.rf-book{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800;color:var(--glow)}
.rf-book .ic{width:18px;height:18px}
.rf-words{display:grid;gap:8px;margin-top:14px}
.rf-word{position:relative;padding:11px 46px 11px 13px;border-radius:14px;background:var(--bg);border:1.5px solid rgba(139,92,246,.5);transition:border-color .25s,background-color .25s}
.rf-word.bonus{border-style:dashed;border-color:rgba(245,158,11,.55)}
.rf-word.used{border-color:var(--green);border-style:solid;background:rgba(16,185,129,.08)}
.rf-word-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.rf-word-top b{font-size:16px;font-weight:900}
.rf-word p{margin-top:3px}
.rf-check{position:absolute;top:50%;right:12px;width:24px;height:24px;margin-top:-12px;border-radius:50%;display:grid;place-items:center;
  background:var(--green);color:#03140D;opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s var(--spring)}
.rf-check .ic{width:14px;height:14px;stroke-width:3}
.rf-word.used .rf-check{opacity:1;transform:none}
.rf-xp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rf-xp .tag .ic{width:13px;height:13px;margin:0}
.rf-notes{margin:8px 0 0;padding-left:18px;color:var(--text);line-height:1.5}
.rf-notes b{display:inline;font-size:inherit;margin:0}
.rf-bonus-note{font-size:13px;color:var(--muted);margin-top:6px}
.rf-hint{text-align:center;font-size:13px;font-weight:700;color:var(--dim);margin-top:8px}

// --- Dates (local time) ---
function dayKey(d = new Date()) {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
}
function shiftDay(key, delta) {

}
function dayStart(ms = Date.now()) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
function daysFromToday(n) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d.getTime(); }
const dayDiff = (fromMs, toMsVal) => Math.round((dayStart(toMsVal) - dayStart(fromMs)) / 86400000);
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';

function relDue(ms) {
  if (!ms) return 'new';
  const n = dayDiff(Date.now(), ms);
  if (n <= 0) return 'due now';
  if (n === 1) return 'tomorrow';
  if (n < 14) return `in ${n} days`;
  if (n < 60) return `in ${Math.round(n / 7)} weeks`;
  return `in ${Math.round(n / 30)} months`;
}
function timeAgo(ms) {
  const s = Math.max(0, (Date.now() - toMs(ms)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return `${sec}s`;
  const m = Math.round(sec / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}:${pad2(m)}:${pad2(ss)}` : `${m}:${pad2(ss)}`;
}

// --- Word matching (shared by drills, stories, speech checks) ---
const TOKEN_RE = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
const TOKEN_SPLIT = /([A-Za-z]+(?:['’-][A-Za-z]+)*)/;
const tokensOf = text => (String(text || '').match(TOKEN_RE) || []).map(t => t.toLowerCase());

// "scrutinize" matches scrutinized / scrutinizing, "ponder" matches pondered, and so on
function wordMatches(token, word) {
  const t = String(token).toLowerCase(), w = String(word).toLowerCase();
  if (t === w) return true;
  const L = w.length;
  const stem = L >= 8 ? w.slice(0, L - 2) : L === 7 ? w.slice(0, L - 1) : (w.endsWith('e') ? w.slice(0, -1) : w);
  return t.startsWith(stem) && t.length - L <= 5;
}
function findWordForm(text, word) {
  const raw = String(text || '').match(TOKEN_RE) || [];
  const w = String(word).toLowerCase();
  return raw.find(t => t.toLowerCase() === w) || raw.find(t => wordMatches(t, w)) || null;
}
const usesWord = (text, word) => !!findWordForm(text, word);

function blankSentence(sentence, word) {
  const s = String(sentence || '');
  const form = findWordForm(s, word);
  if (!form) return null;
  const m = s.match(new RegExp(`(^|[^A-Za-z])${escapeRe(form)}(?![A-Za-z])`));
  if (!m) return null;
  const at = m.index + m[1].length;
  return { text: s.slice(0, at) + '____' + s.slice(at + form.length), answer: form };
}

function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

// Lenient speech match: handles split words ("eff ervescent") and near-misses
function saidMatches(transcript, word) {
  const tk = tokensOf(transcript);
  if (!tk.length) return false;
  const w = String(word).toLowerCase();
  const cands = new Set([...tk, tk.join(''), ...tk.slice(1).map((x, i) => tk[i] + x)]);
  for (const c of cands) {
    if (wordMatches(c, w) || 1 - lev(c, w) / Math.max(c.length, w.length) >= 0.75) return true;
  }
  return false;
}

// Turns a story into HTML with each batch word highlighted once.
// Gemini marks words with **double asterisks**; plain text is scanned as a fallback.
function markStory(text, words) {
  const open = new Map(words.map(w => [w.wordId, String(w.word).toLowerCase()]));
  const claim = phrase => {
    for (const t of tokensOf(phrase)) {
      for (const [id, w] of open) if (wordMatches(t, w)) { open.delete(id); return id; }
    }
    return null;
  };
  const segs = String(text || '').split(/(\*\*[^*]+?\*\*)/g).map(s => {
    const bold = /^\*\*[^*]+\*\*$/.test(s);
    return { s: bold ? s.slice(2, -2) : s, bold, id: null };
  });
  segs.forEach(seg => { if (seg.bold) seg.id = claim(seg.s); });
  const mark = (id, inner) => `<mark class="hl" data-act="word-tip" data-w="${esc(id)}" role="button" tabindex="0">${esc(inner)}</mark>`;
  return segs.map(seg => {
    if (seg.bold) return seg.id ? mark(seg.id, seg.s) : `<b>${esc(seg.s)}</b>`;
    return seg.s.split(TOKEN_SPLIT).map((part, i) => {
      if (i % 2 === 0) return esc(part);
      const id = claim(part);
      return id ? mark(id, part) : esc(part);
    }).join('');
  }).join('').replace(/\n+/g, '<br>');
}

function toast(msg, { type = 'info', ic = '', action = null, ms = 0 } = {}) {
  const box = $('#toasts');

  el.className = `toast ${type}`;

  const dismiss = () => {
    clearTimeout(timer);
    if (el.classList.contains('leaving')) return;
    el.classList.add('leaving');

  };
  if (action && typeof action.onClick === 'function') {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'toast-action';
    b.textContent = action.label || 'Undo';
    b.addEventListener('click', ev => { ev.stopPropagation(); action.onClick(); dismiss(); });
    el.appendChild(b);
  }
  el.addEventListener('click', dismiss);
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  timer = setTimeout(dismiss, ms || (action ? 5500 : type === 'celebrate' ? 4500 : 3200));
  if (type === 'error') haptic([12, 50, 12]);
  return dismiss;
}

// --- Confetti ---
let confettiRaf = 0;
function confetti(amount = 150) {
  if (reduceMotion()) return;
  const cv = $('#confetti');
  if (!cv) return;
  const ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv.style.display = 'block';
  const colors = ['#3B82F6', '#60A5FA', '#10B981', '#F59E0B', '#8B5CF6', '#22D3EE', '#FB7185', '#E3E3E3'];
  const parts = Array.from({ length: amount }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.25, y: H * 0.32,
    vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 15 - 4,
    s: Math.random() * 6 + 5, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
    c: colors[Math.random() * colors.length | 0]
  }));
  cancelAnimationFrame(confettiRaf);
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    if (++frame < 180) confettiRaf = requestAnimationFrame(tick);
    else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  };
  tick();
}

// Little burst of colored sparks from a button (cheers, high fives)
function sparkBurst(el, n = 14) {
  if (!el || reduceMotion()) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ['#F59E0B', '#60A5FA', '#10B981', '#FB7185', '#8B5CF6', '#22D3EE'];
  for (let i = 0; i < n; i++) {

    document.body.appendChild(s);

const Sound = {
  ctx: null,
  seqs: {
    tap: [[620, 0.035]], flip: [[880, 0.03], [1175, 0.03]],
    good: [[660, 0.07], [988, 0.12]], bad: [[311, 0.09], [233, 0.16]],
    success: [[523, 0.08], [659, 0.08], [784, 0.16]], chime: [[784, 0.14], [988, 0.14], [1319, 0.3]],
    cheer: [[523, 0.06], [659, 0.06], [784, 0.06], [1047, 0.2]], streak: [[440, 0.07], [554, 0.07], [659, 0.07], [880, 0.22]]
  },
  play(kind) {
    if (!prefs.sound) return;
    const seq = this.seqs[kind];
    if (!seq) return;
    try {
      this.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx;
      if (c.state === 'suspended') c.resume();
      let t = c.currentTime + 0.01;
      for (const [f, d] of seq) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.08, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d + 0.03);
        t += d * 0.85;
      }
    } catch {}
  }
};

/* =====================================================================

   ===================================================================== */
const layers = [];
let skipPops = 0;
function pushLayer(name, close) {
  layers.push({ name, close });
  try { history.pushState({ inklit: name, depth: layers.length }, ''); } catch {}
}
function dropLayer(name) {
  const i = layers.map(l => l.name).lastIndexOf(name);
  if (i < 0) return;
  layers.splice(i, 1);
  skipPops++;
  try { history.back(); } catch { skipPops--; }
}
addEventListener('popstate', () => {
  if (skipPops > 0) { skipPops--; return; }
  const top = layers.pop();
  if (top) top.close(true);
});

const sheetRoot = $('#sheet-root');
let sheetCfg = null;
const isSheetOpen = () => sheetRoot.classList.contains('open') && !sheetRoot.classList.contains('closing');

const sheetHead = (title, ic = '') =>
  `<div class="sheet-head"><h3 class="sheet-title">${ic ? icon(ic) : ''}${esc(title)}</h3><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${icon('x')}</button></div>`;

function openSheet(html, { wide = false, dismissable = true, onClose = null, label = 'Dialog' } = {}) {
  const already = isSheetOpen();
  clearTimeout(sheetRoot._t);
  const prev = sheetCfg;
  sheetCfg = { dismissable, onClose };
  if (already && prev?.onClose) { try { prev.onClose('replaced'); } catch (e) { console.error(e); } }
  sheetRoot.classList.remove('closing');
  sheetRoot.innerHTML = `<div class="backdrop"></div><div class="sheet${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab" aria-hidden="true"></div>${html}</div>`;
  sheetRoot.classList.add('open');
  document.body.classList.add('locked');
  hydrateIcons(sheetRoot);
  const sheet = $('.sheet', sheetRoot);
  $('.backdrop', sheetRoot).addEventListener('click', () => { if (sheetCfg?.dismissable) closeSheet('backdrop'); });
  // Once the entrance finishes, park the animation so a swipe snap-back can't replay it
  sheet.addEventListener('animationend', () => { if (!sheetRoot.classList.contains('closing')) sheet.style.animationName = 'none'; }, { once: true });
  bindSheetSwipe(sheet);
  if (!already) pushLayer('sheet', () => closeSheet('back', true));
  if (innerWidth >= 768) requestAnimationFrame(() => sheet.querySelector('[autofocus]')?.focus({ preventScroll: true }));
  return sheet;
}

function closeSheet(reason = 'close', fromHistory = false) {
  if (!isSheetOpen()) return;
  const cfg = sheetCfg;
  if (fromHistory && cfg && !cfg.dismissable) {
    pushLayer('sheet', () => closeSheet('back', true)); // required sheets stay put on Back
    return;
  }
  sheetCfg = null;
  const sheet = $('.sheet', sheetRoot);
  if (sheet) sheet.style.animationName = '';
  sheetRoot.classList.add('closing');
 sheetRoot._t = setTimeout(() => {
    sheetRoot.classList.remove('open', 'closing');
    sheetRoot.innerHTML = '';
    if (!$('#lesson-root').children.length) document.body.classList.remove('locked');
    onSheetClosed(); // V2.1: opens a waiting reading reflection
  }, reduceMotion() ? 0 : 230);
  if (!fromHistory) dropLayer('sheet');
  try { cfg?.onClose?.(reason); } catch (e) { console.error(e); }
}

function bindSheetSwipe(sheet) {
  let y0 = 0, dy = 0, drag = false;
  sheet.addEventListener('touchstart', e => {
    if (innerWidth >= 768 || !sheetCfg?.dismissable) return;
    if (e.target.closest('input, textarea, select, .range, .stars')) return;
    if (sheet.scrollTop > 0 && !e.target.closest('.grab, .sheet-head')) return;
    y0 = e.touches[0].clientY; dy = 0; drag = true;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!drag) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 6) { sheet.classList.add('dragging'); sheet.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  const end = () => {
    if (!drag) return;
    drag = false;
    sheet.classList.remove('dragging');
    if (dy > 110) closeSheet('swipe');
    else if (dy > 0) {
      sheet.style.transition = 'transform .35s cubic-bezier(.16,1,.3,1)';
      sheet.style.transform = '';
      setTimeout(() => { sheet.style.transition = ''; }, 360);
    }
    dy = 0;
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
}

function confirmSheet({ title, text = '', confirm = 'Confirm', cancel = 'Cancel', danger = false, ic = '' }) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const sheet = openSheet(`${sheetHead(title, ic)}${text ? `<p class="muted">${esc(text)}</p>` : ''}
      <div class="sheet-actions"><button type="button" class="btn btn-ghost" data-act="close-sheet">${esc(cancel)}</button>

/* =====================================================================
   11. GEMINI CLIENT — each user's own key, called straight from their browser
   ===================================================================== */
const AI = {
  base: 'https://generativelanguage.googleapis.com/v1beta/models/',
  models: ['gemini-3.5-flash-lite', 'gemini-3.6-flash'],
  overrides: {
    'gemini-3.5-flash-lite': { thinkingConfig: { thinkingLevel: 'minimal' } },
    'gemini-3.6-flash': { thinkingConfig: { thinkingLevel: 'minimal' } }
  },
  timeoutMs: 20000,
  cooldownUntil: 0,
  warnedKey: false
};
const getApiKey = () => (localStorage.getItem(KEY_STORE) || '').replace(/\s+/g, '');
const hasAI = () => !!getApiKey();

class AIError extends Error {
  constructor(message, { status = 0, fatal = false, code = '' } = {}) {
    super(message);
    this.name = 'AIError';
    this.status = status;
    this.fatal = fatal;
    this.code = code;
  }
}

function parseJSON(text) {
  try { return JSON.parse(text); }
  catch { return JSON.parse(String(text).replace(/```(?:json)?/gi, '').trim()); }
}

function warnBadKey() {
  if (AI.warnedKey) return;
  AI.warnedKey = true;
  toast("Gemini didn't accept your key. You can update it in Settings.", {
    type: 'error', ic: 'key', action: { label: 'Settings', onClick: () => ACTIONS['open-settings']?.() }
  });
}

async function askGemini(prompt, schema, { temperature = 0.7, maxTokens = 2048, timeoutMs = AI.timeoutMs, models = AI.models } = {}) {
  const key = getApiKey();
  if (!key) throw new AIError('No Gemini key', { fatal: true, code: 'no-key' });
  if (navigator.onLine === false) throw new AIError('Offline', { code: 'offline' });
  if (Date.now() < AI.cooldownUntil) throw new AIError('Cooling down', { code: 'cooldown', status: 503 });

  let last = null;
  for (const model of models) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(`${AI.base}${model}:generateContent`, {
        method: 'POST',
        signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: {
            temperature, maxOutputTokens: maxTokens,
            responseMimeType: 'application/json', responseSchema: schema,
            ...(AI.overrides[model] || {})
          }
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data?.error?.message || `HTTP ${res.status}`;
        const fatal = res.status === 401 || ([400, 403].includes(res.status) && /api[ _-]?key/i.test(msg));
        throw new AIError(msg, { status: res.status, fatal, code: fatal ? 'bad-key' : '' });
      }
      if (data?.promptFeedback?.blockReason) throw new AIError(`Blocked: ${data.promptFeedback.blockReason}`);
      const text = (data?.candidates?.[0]?.content?.parts || [])
        .filter(p => typeof p.text === 'string' && !p.thought).map(p => p.text).join('').trim();
      if (!text) throw new AIError('Empty response');
      return parseJSON(text);
    } catch (e) {
      last = e?.name === 'AbortError' ? new AIError('Timed out', { status: 408, code: 'timeout' }) : e;
      if (last?.fatal) break; // a bad key fails the same way on every model
      console.info(`[InkLit] ${model} failed:`, last?.message);
    } finally {
      clearTimeout(timer);
    }
  }
  if (last instanceof TypeError || [408, 429, 500, 502, 503, 504].includes(last?.status)) {
    AI.cooldownUntil = Date.now() + 20000;
  }
  if (last?.fatal && last.code === 'bad-key') warnBadKey();
  throw last || new AIError('Gemini failed');
}

async function testGeminiKey(key) {
  try {
    const res = await fetch(AI.base + AI.models[0], { headers: { 'x-goog-api-key': key } });
    if (res.ok) return 'ok';
    if (res.status === 404) return 'no-model';
    if (res.status === 429) return 'busy';
    return 'bad';
  } catch { return 'offline'; }
}

function aiErrorText(err) {
  if (!err) return 'Gemini was unavailable';
  if (err.code === 'no-key') return 'No Gemini key added';
  if (err.code === 'bad-key') return 'Your Gemini key was rejected';
  if (err.code === 'offline' || err instanceof TypeError) return "You're offline";
  if (err.status === 408) return 'Gemini took too long';
  if (err.status === 429) return 'Gemini is busy right now';
  return 'Gemini was unavailable';
}

/* =====================================================================
   12. SPEECH — read aloud + listen for a spoken word or sentence
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = !!SR;
const canSpeak = 'speechSynthesis' in window;
if (canSpeak) { try { speechSynthesis.getVoices(); } catch {} }

function speak(text, rate = 0.9) {
  if (!canSpeak || !text) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'en-US';
    u.rate = rate;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => /^en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
    return true;
  } catch { return false; }
}

// Returns { stop, abort } or null when this browser can't listen
function listen({ onText, onEnd, onError } = {}) {
  if (!SR) return null;
  try { window.speechSynthesis?.cancel(); } catch {} // so it doesn't hear its own voice
  const r = new SR();
  r.lang = 'en-US';
  r.interimResults = true;
  r.maxAlternatives = 5;
  r.continuous = false;
  let ended = false;
  r.onresult = e => {
    const alts = [];
    let text = '', isFinal = false;
    for (let i = 0; i < e.results.length; i++) {
      const res = e.results[i];
      text += res[0].transcript;
      if (res.isFinal) isFinal = true;
      for (let j = 0; j < res.length; j++) alts.push(res[j].transcript);
    }
    onText?.(text.trim(), alts, isFinal);
  };
  r.onerror = e => onError?.(e.error || 'error');
  r.onend = () => { if (!ended) { ended = true; onEnd?.(); } };
  try { r.start(); } catch { return null; }
  return {
    stop() { try { r.stop(); } catch {} },
    abort() { try { r.abort(); } catch {} }
  };
}

/* =====================================================================
   13. IMAGES — book covers are shrunk and stored inside the book's Firestore doc
   ===================================================================== */
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Unreadable image')); };
    img.src = url;
  });
}
function drawScaled(src, maxW, maxH) {
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  const s = Math.min(1, maxW / w, maxH / h);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s));
  c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
// Most common strong color in an image; used to tint the book's spine on the shelf
function dominantColor(canvas) {
  try {
    const small = drawScaled(canvas, 32, 32);
    const px = small.getContext('2d').getImageData(0, 0, small.width, small.height).data;
    const buckets = new Map();
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i], g = px[i + 1], b = px[i + 2];
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const sat = max ? (max - min) / max : 0;
      const key = ((r >> 5) << 6) | ((g >> 5) << 3) | (b >> 5);
      const e = buckets.get(key) || { score: 0, n: 0, r: 0, g: 0, b: 0 };
      e.score += 1 + sat * 2; e.n++; e.r += r; e.g += g; e.b += b;
      buckets.set(key, e);
    }
    let best = null;
    buckets.forEach(e => { if (!best || e.score > best.score) best = e; });
    if (!best) return null;
    const hx = v => Math.round(v / best.n).toString(16).padStart(2, '0');
    return `#${hx(best.r)}${hx(best.g)}${hx(best.b)}`;
  } catch { return null; }
}
async function coverFromFile(file) {
  const img = await loadImageFile(file);
  const c = drawScaled(img, 320, 480);
  return { url: c.toDataURL('image/jpeg', 0.78), color: dominantColor(c) };
}

function normalizeProfile(p = {}) {

// SRS word schema (wordId, state, repetitionCount, easeFactor, interval, lastReviewed, nextDueDate) + lesson content
